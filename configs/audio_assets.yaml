# 동물 효과음 — 🔽 우선순위 낮음(2026-08-07 결정). 파일 없어도 놀이는 정상 동작한다.
#
# 놀이의 핵심은 봇이 TTS 로 "멍멍" 하고 아이가 "강아지"를 맞히는 것이고, 이건 이미
# 잘 된다. 진짜 짖는 소리로 바꾸면 오히려 나빠진다:
#   - "멍멍"은 소리 흉내가 아니라 **2세가 실제로 쓰는 한국어 어휘**다
#     (많은 아이가 '강아지'보다 '멍멍이'를 먼저 말한다)
#   - 아이는 "멍멍"을 즉시 따라 하지만 진짜 짖는 소리는 따라 할 수 없다.
#     이 프로젝트 목표가 발화 유도라면 따라 할 수 있는 쪽이 맞다
# → 효과음은 '흥미 유발'용 선택 기능이다("진짜 강아지는 이런 소리야! 우리는
#   멍멍이라고 해!"). 파일이 없으면 그 연출만 빠지고 놀이는 그대로 돌아간다.
#
# 목록은 scenario_cards.json 의 sound_match 8종과 1:1로 유지한다(테스트가 강제).
# 나중에 넣더라도 카드와 어긋나지 않게 하려는 것 — 파일 유무와는 무관하다.
