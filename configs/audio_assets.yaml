# ============================================================
# 오디오 에셋 레지스트리 — 봇이 '실제로 낼 수 있는 소리'의 목록
# ------------------------------------------------------------
# 노래는 TTS 로 못 부른다(읽을 뿐이다). 그래서 동요·효과음은 음원 파일이고,
# 여기 적힌 것이 곧 봇의 능력이다. app/audio_player.py 가 읽는다.
#
# 🔴 파일이 없는 항목은 자동으로 '못 하는 것'이 된다.
#    AudioLibrary.playable()/titles() 가 파일 실재 여부로 걸러 주므로, 목록에
#    적어 두기만 하고 파일을 아직 안 넣었어도 봇이 "틀어줄게"라고 약속하지 않는다.
#    → 그래서 아래 목록은 '갖고 싶은 것'을 먼저 적어 둬도 안전하다.
#    기동 시 AudioLibrary.missing() 으로 빠진 파일을 확인할 것.
#
# ⚠️ 저작권 — 시연·논문에 들어가므로 반드시 확인하고 채울 것.
#    license 필드에 근거를 남긴다. 안전한 순서:
#      1) PD(저작권 만료·전래·외국 민요)  2) 직접 녹음(부모 목소리가 제일 좋다)
#      3) CC0/CC-BY 음원  4) 라이선스 구매
#    ❌ 상업 창작동요(핑크퐁 '아기상어' 등)는 그대로 쓰면 안 된다.
#    license: 확인필요 = 아직 판단 안 함. 파일 넣기 전에 반드시 갱신.
#
# 파일명은 ASCII 로 쓴다 — 한글 파일명은 scp 로 젯슨에 보낼 때 인코딩이 깨진다
# (.gitattributes 로 잡은 CRLF 문제와 같은 부류).
# 실제 파일은 assets/ 아래 두며 git 미추적이다(용량). assets/README.md 참조.
# ============================================================

# ------------------------------------------------------------
# 🔴 2026-08-31 공유마당 전수 조사 결과 — 여기 적힌 것이 실제로 받을 수 있는 전부다
#
# 등록돼 있던 5곡 중 **넷은 공유마당에 아예 없다**(음악 분야 검색 0건):
#     나비야 0건 · 곰 세 마리 0건 · 머리 어깨 무릎 발 0건 · 산토끼 0건
#   그 넷은 아래에 남겨 두되 license 에 '없음'을 적어 둔다. 다시 찾아 헤매지 말 것.
#
# 대신 쓸 수 있는 것이 두 갈래로 나온다. **성질이 다르니 섞어 쓰면 안 된다:**
#
#   A. 기증저작물 자유이용 — 차용운 창작동요 10곡. **사람이 부른 노래다.**
#      1997~2000년 MBC 뽀뽀뽀 방송곡을 개사·재완성해 기증한 것. 23초~1분 11초.
#      → 2세에게 '노래를 틀어 준다'가 성립하는 건 이쪽뿐이다.
#
#   B. CC BY — 한국저작권위원회 '국악연주곡'. **가창이 없는 연주곡이다.**
#      상세 설명에 "저작권이 만료된 곡을 이용하여 실연과 녹음을 하였습니다.
#      상업적·비상업적으로 자유롭게 활용 가능"이라고 못박혀 있다.
#      🟢 곡(작곡)과 녹음(저작인접권) **두 층이 다 풀린** 흔치 않은 음원이다.
#      ⚠️ 다만 아이가 아는 그 노래 소리는 아니다. 멜로디만 맞다.
#
# ❌ 가창 동요는 공유마당에 A 말고는 없다. '어린이' 검색 77건은 전부 효과음·현장음이다.
# 받는 곳: https://gongu.copyright.or.kr → 음악 → 검색. UCI 코드로 바로 찾을 수 있다.
# ------------------------------------------------------------

