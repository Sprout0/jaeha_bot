# 모델 경로 및 런타임 설정 (가이드 5: 8GB 안 안정 구동 우선)
#
# ⚠️ 이 파일은 **젯슨(운영) 기준값**이다. push_code.sh 가 configs/ 를 젯슨에 밀어넣어
#    두 기계가 이 한 벌을 공유한다. 노트북처럼 값이 달라야 하는 기계는 이 파일을 고치지 말고
#    `configs/local.yaml`(git 미추적·push 제외)에 바뀔 키만 적는다. 예시: configs/local.example.yaml
#    여기를 직접 고치면 push 할 때 젯슨 설정이 함께 망가진다.
stt:
  # 순정 다국어 whisper-small. 2026-08-04 ablation(AI-Hub #003, 9세 148발화)에서
  # 한국어 파인튜닝판(SungBeom/whisper-small-ko)보다 명백히 우수해 되돌림:
  #
  #   구성                          CER    심각실패  폭주  답변률   RTF
  #   순정 small + 아래 디코딩      7.50%     0건    0건   100%   0.363   ← 채택
  #   ko 파인튜닝 + 디코딩 + 가드   7.23%     4건    0건  89.2%   0.431
  #   ko 파인튜닝 + 디코딩         31.12%    18건   10건   100%   0.539
  #   ko 파인튜닝 + 순정 디코딩    28.68%    32건    4건   100%   1.193
  #
  # 🔴 핵심: 반복 환각(폭주)의 원인은 ko 파인튜닝 모델 자체였다. 순정은 폭주 0건이다.
  #    beam_size·no_repeat_ngram·temperature 캡·dedupe·글자수 가드는 전부 그 상처를
  #    덮는 장치였고, 순정에선 그런 보정 없이도 무너지지 않는다.
  #    같은 발화 대조: "저는 멜슨 만델라를 존경해요" → ko 폭주 / 순정 CER 0%.
  # 🔴 답변률이 중요하다. ko+가드는 CER 이 낮아 보이지만 16건(10.8%)을 버려 되묻는다.
  #    순정은 148건 전부 답하면서 7.50%. 대화 로봇에선 이쪽이 낫다.
  # ⚠️ 이 비교는 9세 음성 기준. 실제 3세 녹음이 생기면 다시 확인할 것.
  # ── 모델 선택 (2026-08-05 젯슨 GPU 스윕, 148발화 동일조건 실측) ────────────
  #   모델              CER     완벽일치  발화당   체감대기*  동시적재여유
  #   small            7.27%    52.7%    0.61s    2.27s      2.88GB
  #   medium           4.21%    71.6%    1.32s    2.97s      2.23GB
  #   large-v3-turbo   2.96%    78.4%    1.59s    3.24s      1.99GB   ← 현재
  #   * 체감대기 = 인식 + 생각(1.65s). TTS 재생은 봇이 말하는 시간이라 제외.
  #
  # turbo 채택 이유: small 대비 CER 59% 감소(오인식 4번중 1번 -> 1번중 0.2번).
  #   비용은 +0.98s 뿐이고, 이 값도 아침의 ko 파인튜닝(8.69s)보다 5배 빠르다.
  #   지금 수치는 9세 기준인데 실제 대상인 2~3세는 모든 모델이 나빠지므로,
  #   입력이 어려울수록 모델 여유분이 더 중요하다.
  # ⚠️ 최종 확정은 LLM API 전환 후로 미룸 — 생각(1.65s)이 줄면 STT 예산이 늘어
  #   선택이 달라질 수 있다. 그때 아래 세 줄을 바꿔가며 재판단할 것.
  # 셋 다 STT+TTS+LLM 동시적재 OOM 여유 충분. 캐시 후 로드는 4초.
  # 🔴 2026-08-18 turbo -> medium. **실제 대상 연령(3~6세)에서 순위가 뒤집혔다.**
  #    위 08-05 표는 전부 9세(화자 4명) 기준이었다. AI-Hub #108 의 'AI챗봇' 수집분에서
  #    3~6세를 확보해(153발화·화자 114명) 젯슨에서 다시 재니:
  #
  #      모델    인식중앙   CER(3~6세)  심각실패   (참고: 9세 CER)
  #      small    0.557s     41.08%     56/153      6.87%
  #      medium   1.190s     31.46%     38/153      3.35%   <- 채택
  #      turbo    1.549s     36.38%     44/153      1.88%
  #
  #    🔴 turbo 가 지는 이유: **흐릿한 유아 발화에서 다른 언어로 환각한다.**
  #       '햇빛이 밝아요' -> "Heppi tý barga hjú." / '아기가 젖을 먹어요' -> "揚げがチャーレル曲がよう。"
  #       language="ko" 는 정상 강제되고 있다 — 디코더가 4층으로 증류된 turbo 의 성질이다.
  #    ➡️ medium 은 turbo 보다 **빠르면서 정확하다**(-0.36s, -4.9%p, -124MB). 거래가 아니다.
  #    ⚠️ 최선이 CER 31% 다. '아이 말을 알아듣는다'에 기대는 설계는 성립하지 않는다 —
  #       놀이의 흉내·따라하기 방향과 _heard() 가 정답 낱말을 쓰는 구조가 그래서 맞다.
  #    원본: reports/stt/ (발화별 정답·출력·CER)
  model_size: medium
  # model_size: large-v3-turbo  # 9세 이상·또렷한 발화만 볼 때. 유아는 위 표대로 진다
  # model_size: small           # 최속(0.557s). 다만 3~6세 CER 41% 로 크게 나쁘다
  # ⛔ 옛 한국어 파인튜닝판(models/whisper-small-ko-ct2)은 2026-08-05 에 삭제했다.
  #    폭주의 원인이라 되돌릴 이유가 없다. 필요하면 HF 의 SungBeom/whisper-small-ko 를 다시 변환할 것.
  # ✅ 2026-08-05: ctranslate2 를 CUDA 로 소스빌드해 GPU 사용 가능해짐(cuda_device_count=1).
  #    젯슨 실측(같은 12발화): CPU 3.06s/발화 -> GPU 0.65s/발화 (RTF 0.686 -> 0.145, 4.7배).
  #    인식 결과는 CPU 와 글자 단위로 동일 — float16 로 인한 품질 손실 없음.
  #    빌드: ~/.local/ct2 에 설치, conda activate.d/zz_ld.sh 가 LD_LIBRARY_PATH 를 잡아준다.
  #    ⚠️ 노트북(CPU 전용 휠)에서는 cuda 로 두면 죽는다. → 이 줄을 고치지 말고
  #       configs/local.yaml 에 `stt: {device: cpu}` 를 둘 것(기계별 오버레이).
  #    롤백: device 를 cpu 로. 휠 되돌리려면 ~/ct2_rollback/*.whl 을 force-reinstall.
  device: cuda
  compute_type: float16   # GPU 표준. int8 은 GPU 에서 이득이 적고 품질만 손해.
                          # 메모리가 빠듯하면 int8_float16 을 검토할 것.
  cpu_threads: 6          # 젯슨 6코어 전부 사용. 기본값(4)이면 2코어가 논다.
                          # 실측(2026-08-03, 1.6초 오디오): 4.56s -> 3.84s. 인식 결과는 동일.
                          # PC 코어가 적으면 줄일 것(초과 지정은 경합으로 오히려 느려짐).
  silence_duration: 1.2   # 말 끝난 뒤 이만큼 조용하면 종료(초).
                          # 실아동 음성(AI-Hub 108, 9세 600개) VAD 분석(2026-07-23): 문장 내부
                          # 멈칫이 1.0초면 9세도 3.7% 잘림, 1.2초면 2.2%. 3세는 더 오래 멈칫하니
                          # 1.0->1.2 로 올림(잘림↓, 지연 +0.2s). 최종값은 실제 3세 녹음 때 확정.
  # 반복 환각 가드. Whisper 가 정답을 맞힌 '뒤'에 학습문장 잔해를 끝없이 덧붙이는 폭주를 막는다
  # ("...입도 작아요" + "일찍 일찌 일참 일찀 일찱..."). 매 토큰이 달라 dedupe_repeats 가 못 잡고,
  # 매 3-gram 이 달라 no_repeat_ngram_size 도 못 잡는다. 그래서 '말속도'로 자른다.
  # 실측(2026-08-04, AI-Hub #003 9세 148발화): 가드 없으면 CER 31.1%, 12.2%가 심각 붕괴(최악 1200%).
  #   임계 6.0 -> CER 7.13%, 재질문 12.2%
  #   임계 7.0 -> CER 9.52%, 재질문 7.4%(오탐 0)
  #   임계 4.5 -> CER 4.90% 지만 재질문 27% — 4번에 한 번 되물어 대화가 안 됨
  # ➡️ 순정 small 로 되돌린 뒤에는 폭주 자체가 0건이라 가드는 '보험'으로만 남는다.
  #    순정 출력에 임계 6.0 을 걸면 148건 중 1건이 걸리는데 그것도 오탐이었다
  #    (빠르게 말한 정상 발화 "내 생일이 빨리 왔으면 좋겠어요…" 22자/3.2초=6.88글자per초).
  #    정답 말속도 최대가 6.88 이므로 7.0 이면 오탐 0 이면서 보험은 유지된다. → 7.0 채택.
  # ⚠️ 이 값은 9세 기준이다. 유아는 더 천천히 말해(=글자/초가 낮아) 오탐이 줄 것으로 보이나,
  #    실제 3세 녹음으로 반드시 다시 잡을 것. 정답 말속도 실측: 중앙값 3.03 / p95 5.44 / 최대 6.88.
  max_chars_per_sec: 7.0
  # 이 길이(공백 제외 글자수) 미만은 아무리 빨라도 버리지 않는다. 짧은 유아 발화 보호용
  # ("이거 뭐야" 처럼 짧고 빠른 정상 발화가 임계를 넘는다). 진짜 폭주는 본질적으로 길다 —
  # 실측 폭주 출력 최소 16자/중앙값 28자, 임계를 넘긴 폭주는 전부 20자 이상이었다.
  # 20 을 두면 오탐 4건 -> 2건, 진짜 검출은 14건 그대로. null 대신 0 으로 꺼짐.
  min_chars_to_reject: 20
  # 오인식 사후 교정: 고유명사(아이 이름)는 Whisper 학습에 없어 발음대로 적힌다.
  # keywords 와 자모 편집거리가 가까운 토큰을 그 단어로 교정(app/text_norm.py). 오탐 적음.
  # 🔴 2026-08-25 봇 이름을 keywords 에서 뺐다. 옛 이름 '재하봇'은 OOV 라 교정이 필요했지만
  #    '하이티드'는 whisper 가 그대로 읽는다(실측: 힌트 없이 36개 중 35개가 자모거리 0.000,
  #    최대 0.222 — tools/probe_wake_word.py, reports/wake_probe_haitid.json).
  #    게다가 '티드'는 2음절이라 자모거리 정규화상 가까운 낱말이 많아 **과교정 위험**이 크다.
  # ── 배치 추론(BatchedInferencePipeline) ──────────────────────────────────
  # 🟢 2026-08-27 채택. **정답 있는 실아동 음성 153발화**(AI-Hub #108, 3~6세, 화자 114명,
  #    9.5분)를 운영 경로(STTModule)로 양쪽 다 돌린 결과:
  #
  #      구성    CER      완벽일치  심각>50%  지연중앙   p90     선행생각 예산통과
  #      순차   28.79%    68/153    35      1.189s   1.566s      1/153
  #      배치8  28.96%    66/153    37      1.079s   1.193s     25/153   <- 채택
  #
  #    정확도는 **동률**이다(+0.17%p 는 n=153 에서 노이즈). 얻는 건 **p90 -24%** —
  #    편차가 무너져서, 08-19 이후 실기 발동 0회이던 **선행 생각이 처음으로 열린다**
  #    (예산 1.04s = 꼬리 1.20 − spec_after 0.16). beam 축소는 08-05 에 죽었고
  #    남은 후보가 이거뿐이었다. bs=4·8 동률, 16 은 오히려 느림.
  # ⚠️ **말끝을 흘리는 실패가 있다** — 다만 계통적이지 않다. 153개 중 3개(2%)만
  #    접두 관계였고, 그중 둘은 환각 반복 감소("하이하이 하이"->"하이하이")와 조사
  #    하나("마을요"->"마을")다. **진짜 낱말을 잃은 건 1건**("시작! 늑대"->"시작!").
  #    글자수 합 1221 -> 1198(-1.9%), 발화당 평균 0.15자.
  # ⚠️ 되돌리려면 이 한 줄을 false 로. 아이 말끝이 자꾸 잘린다 싶으면 그렇게 할 것.
  # ⚠️ 이 표의 절대 CER 은 reports/stt/README.md 의 08-18 표와 소수점이 다를 수 있다
  #    (채점기를 복원해 153개 중 126개를 재현했고, 남은 27개는 AI-Hub 태그 처리 차이다).
  #    같은 자를 양쪽에 댔으므로 **A/B 비교는 유효하다.**
  batched: true
  batch_size: 8
  keywords: ["하연"]
  aliases: {}             # 실기서 확정 오인식이 나오면 그때 추가한다.

tts:
  # Supertonic-3 (ONNX, 경량, OpenRAIL-M). 모델은 첫 실행 시 HF 자동 다운로드.
  model: supertonic-3
  # 🔴 2026-08-19 F1+F4 -> F2. **블라인드 짝비교 세 라운드의 결과다.**
  #    "더 어린이 같고 유아틱한, 아이에게 친근한 목소리"로 바꿔 달라는 요청에서 출발했다.
  #      1라운드 무작위 조합    -> F3:-0.2+F1:1.2 (F1 에서 아나운서 느낌을 뺀 것)
  #      2라운드 F2 계열 투입   -> **순정 F2**
  #      3라운드 F2 미세조정    -> 순정 F2 가 또 이김. 목소리 축은 다 짜냈다는 뜻
  #      4라운드 시드 14개      -> 777 유지. 속도도 1.05 유지
  #    현행 F1+F4 를 대조군으로 매 라운드 몰래 섞었고 **세 번 다 졌다.**
  # ⚠️ 조합을 만들다 순정으로 돌아온 것이라 '튜닝을 안 했다'가 아니다.
  #    F2 주변 12조합(±0.15/±0.25 섞기·빼기, 리듬 교체)을 다 듣고 순정이 이겼다.
  # 공식 설명상 F2 만 'youthful·playful' 이다(supertonic-py Voices 페이지). 다른 프리셋은
  # 차분(F1)·아나운서(F3)·비즈니스(F4)·오디오북(F5)이라 2세용과 거리가 있다.
  # '+' 로 이으면 tts_module._resolve_style 가 style 벡터를 섞는다(가중치·외삽·음색|리듬 지원).
  voice: F2
  language: ko
  speed: 1.05          # 모델 학습 sweet spot(=자연스러움 기본값). 1.0 은 살짝 처져 우울하게 들려 1.05 로.
  # 🔴 2026-08-24 12 -> 24. **TensorRT 로 번 시간을 음질에 되돌린 것**이다(아래 trt 참고).
  #    원래 16 이었는데 젯슨 속도 때문에 12 로 낮췄던 값이다. TRT 가 스텝당 23ms -> 9.5ms
  #    로 만들어 그 제약이 사라졌다. 젯슨 실측(5문장 x 3회, 길이 섞인 실기 조건):
  #      CUDA @12   817.0ms   <- 예전 운영값
  #      CUDA @16   957.9ms   <- 속도 때문에 포기했던 값
  #      TRT  @12   370.9ms
  #      TRT  @16   400.0ms
  #      TRT  @20   441.8ms
  #      TRT  @24   453.8ms   <- 채택. 스텝 2배인데도 예전보다 -363ms
  #    24 를 고른 이유: TRT@12 에서 3·4번 시청각 표본에 '한 번 튀는 소리'가 들렸다.
  #    스텝이 적을수록 스텝당 오차가 결과에 크게 남으므로 스텝을 되돌려 덮었다.
  #    ⚠️ trt: false 로 되돌릴 거면 이 값도 12 로 함께 내려야 한다 — CUDA@24 는 1초를 넘는다.
  total_steps: 24
  threads: 4          # onnxruntime intra-op 스레드. 실측 최적(6/8은 경합으로 느려짐)
  # onnxruntime 실행 프로바이더. supertonic 기본값은 CPU 하나뿐이라 젯슨 GPU 가 놀았다.
  # 노트북엔 CUDA 가 없으므로 자동으로 CPU 로 내려간다(경고 없음) — 같은 파일을 공유해도 안전.
  providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]

  # 재생 **뒤**에 덧대는 무음(초). 앞(PLAY_PAD_S=0.15)과 따로다.
  # 🔴 2026-08-26 젯슨 청취에서 답변도 말끝이 끊겼다. 필러 쪽 근거는 filler.tail_pad_s 참고.
  # ⚠️ 앞과 달리 뒤는 **공짜가 아니다.** speak() 은 sd.wait() 로 버퍼 끝까지 기다리므로
  #    늘린 만큼 봇이 늦게 듣기 시작한다(체감 응답속도가 아니라 다음 턴 진입이 늦어진다).
  #    그래서 필러(0.6)보다 짜다. `python -m tools.check_filler --measure` 로 실측되면
  #    그 값으로 내릴 것 — 지금은 청취에 근거한 **잠정치**다.
  play_tail_pad_s: 0.45

  # ── TensorRT (확산·보코더만) ────────────────────────────────────────────────
  # 🔴 왜 필요했나. CUDA EP 는 **직전 호출과 입력 모양이 다르면** 확산 1스텝에 ~180ms 를
  #    문다. 두 모양을 각각 6번씩 예열한 뒤에도 그렇다:
  #      A 181.2ms(직전과 다름) -> 50.2 -> 27.1 -> 27.0 | B 184.5ms | A 180.6ms
  #    문장마다 길이가 다르니 실기에선 매 턴 낸다.
  # ⚠️ '처음 보는 모양'이 아니라 '직전과 다른 모양'이 비용이라, 모양 가짓수를 줄이는
  #    버킷팅은 **원리적으로 무의미**하다(예열해도 안 준다). 유일한 방법인 패딩은 소리를
  #    바꾼다 — 실측: text_enc 겹치는 구간 최대차 0.444, vector_est 0.206, 파형 상관 0.007.
  #    ORT 옵션도 전부 무효였다: cudnn_conv_algo_search HEURISTIC(546->546ms)·
  #    DEFAULT(1778ms, 더 나쁨), enable_mem_pattern=false(539ms), arena(540ms).
  # ➡️ TRT 는 min/opt/max 프로파일로 엔진을 미리 구워 이 비용을 없앤다:
  #      모양 바뀜 +271.5ms -> +10.7ms / 고정 상태에서도 2.4배 빠름
  # ⚠️ 기동이 약 6.4초 늘어난다(캐시가 더울 때). **첫 실행은 확산 72s + 보코더 49s** 를
  #    엔진 빌드에 쓴다. 캐시를 지우면 그 값을 다시 문다.
  # ⚠️ dp·text_encoder 에는 안 붙인다 — TRT 빌드가 실패하고(Pad 출력에 shape 없음,
  #    ORT-TRT 알려진 제약) 모양 고정 상태에서 합쳐 20ms 뿐이라 값어치도 없다.
  # 노트북엔 TensorRT 가 없어 자동으로 건너뛴다(경고 없음) — 같은 파일을 공유해도 안전.
  trt: true
  trt_cache: "~/.cache/trt_supertonic"
  # 프로파일 상한. 이 범위를 넘는 발화가 오면 엔진을 다시 구워 오히려 느려진다.
  # latent 200 ≈ 13.9초 발화. 실기 답변은 18~33자(2~4초)라 넉넉하다.
  trt_max_latent: 200
  trt_max_text: 256
  seed: 777           # diffusion 노이즈 시드 고정 -> 말투·속도 일정.
                      # 2026-08-19 F2 로 바꾼 뒤 시드 14개(1/5/7/42/88/100/555/777/999/1234/
                      # 2024/12345/31337/20260819)를 블라인드 짝비교해 777 유지로 확정.
                      # ⚠️ 시드는 목소리마다 다시 골라야 한다 — 원래 777 은 F1 기준으로
                      #    고른 값이었고, F2 에 맞는다는 보장이 없어서 다시 쟀다(결과는 같았다).
                      # 캐릭터 바꾸려면 다른 정수(1234/7/42/2024 등). null 이면 매번 랜덤.
  gap: 0.2            # 문장 사이 무음(초). 앞뒤 pad 합쳐 총 간격≈0.3s(TTS 표준). 붙이려면 0.15, 띄우려면 0.3

  # ── 원격 백엔드(선택) ──────────────────────────────────────────────────────
  # backend: openai 로 바꾸면 gpt-4o-mini-tts 로 말한다. .env 의 OPENAI_API_KEY 필요.
  # 실패하면(네트워크·키·타임아웃) 자동으로 Supertonic 으로 내려간다 — 로그에 '폴백'이 찍힌다.
  #
  # 2026-08-10 젯슨 실측(안전 14문항 × 2회):
  #   Supertonic 첫 소리 0.901s (최대 0.988s — 거의 안 흔들린다)
  #   OpenAI     첫 바이트 0.970s / 최대 2.242s (28턴 중 2턴이 1.7s 초과)
  # ➡️ 지연 이득은 없다. 바꾸는 이유는 **목소리**다(청취 비교로 shimmer 채택).
  # ⚠️ 아직 통짜로 받아 재생하므로 실제 첫 소리는 '다운로드 완료' 시각이다.
  #    스트리밍 재생(response_format=pcm)으로 바꾸면 더 줄일 여지가 있다.
  backend: supertonic          # supertonic(로컬·기본) | openai
  openai_model: gpt-4o-mini-tts
  openai_voice: coral          # 청취 비교로 채택. shimmer 로 바꾸면 조금 더 차분하다
  # 톤·속도 지시 — Supertonic 의 speed 에 해당하는 유일한 손잡이다(tts-1 계열은 못 받는다).
  # ⚠️ 손잡이가 헐겁다: 같은 지시문인데 목소리만 바꿔도 같은 문장이 3.05s / 4.50s 로 갈렸다.
  #    숫자로 정확히 잡히지 않으니 바꿀 때마다 귀로 확인할 것.
  # 이력: "천천히"를 넣었더니 답답하다는 평(2026-08-10). 빼면 오히려 길어져서,
  #       '들뜬 아이 친구처럼 빠르게'가 가장 생기 있고 짧았다.
  openai_instructions: "신나서 들뜬 아이 친구처럼 빠르게, 통통 튀게 말해줘."
  openai_timeout: 3.0          # 실측 p95 1.72s / 최대 2.24s → 3초를 넘으면 로컬이 더 빠르다
  # 조각이 오는 대로 재생해 첫 소리를 앞당긴다(통짜 수신 1.25s → 0.6s대 기대).
  # 🔴 소리가 나가기 시작하면 폴백이 불가능하다. 중간에 끊기면 말이 잘린 채 끝나고
  #    로그에 '말이 잘렸다'가 남는다. 안정성을 최우선하려면 false(통짜 수신).
  openai_stream: true

vision:
  model_path: models/yolov8n.pt   # nano 모델로 시작

audio:
  # 마이크/스피커 장치(이름 부분일치). null 이면 시스템 기본.
  # Jetson: 기본 'default'(pulse)가 HDMI로 새서 멈춤 → USB ReSpeaker 를 콕 집음.
  # PC 는 보통 null(기본)로 충분. 실물 장치 바뀌면 이 이름만 수정.
  device: ReSpeaker

youtube:
  # 🔴 2026-09-11 노래 틀기 — 유튜브 공식 IFrame Player API(재생) + Data API v3(검색).
  #   스트림을 뽑지 않는다. 진짜 플레이어를 띄워 튼다(app/youtube.py 머리말).
  # **기본은 꺼짐.** 꺼 두면 봇은 지금과 완전히 같다.
  # 켜면 바뀌는 것: 봇 스피커 출력이 공유 장치(respk = ALSA dmix)로 간다. 마이크는 그대로.
  #   켜기 전 1회:  ./run.sh setup-youtube   (~/.asoundrc 에 respk 를 넣고 준비물을 본다)
  #   켜는 곳:     그 기계의 configs/local.yaml 에  youtube: {enabled: true}
  #   키:          .env 의 YOUTUBE_DATA_KEY (값은 여기 적지 않는다)
  # 준비물이 하나라도 없으면 경고 한 줄 남기고 **노래 기능만 끈다**(봇은 계속 돈다).
  enabled: false
  key_env: YOUTUBE_DATA_KEY
  output_device: respk     # 봇 출력 장치 — **정확한 이름**. 부분일치면 respk_dmix(16kHz 전용)가 먼저 걸린다
  volume: 80               # 플레이어 0~100. 09-11 실청취: 30%×싱크40%(=12%)는 "좀 작았다"
  max_duration_s: 600      # 이보다 긴 영상(모음집)은 뒤로 미룬다 — '티니핑 노래' 1위가 20분짜리였다
  default_query: 동요      # "노래 틀어줘"처럼 곡을 안 말했을 때
  cache_days: 7            # 검색 결과 캐시(쿼터: 검색 100유닛, 하루 10,000)
  # 🔴 2026-09-19 유튜브 '아동용' 지정 영상만 튼다(유튜브 키즈가 가져가는 풀. 키즈 목록 자체는
  #    API 가 없다). 실검색: '티니핑 노래' 8/10·'동요' 10/10 vs '스파이더맨 OST' 0/10.
  kids_only: true
  # 🔴 2026-09-19 영상마다 다른 음량 맞추기(app/loudness.py). 아이 노래 8곡 같은 볼륨 무음 측정:
  #    크게 나오는 구간 -17~-31 dBFS(14dB 차이). 나가는 소리를 재서 플레이어 볼륨을 고친다.
  #    싱크 160%(+11.7dB) × 기본 20 ≈ 옛 80 × 100%. 켜면 위 volume 은 안 쓴다.
  level:
    enabled: true
    target_db: -19         # 크게 나오는 구간(p90) 목표. 콩순이·곰세마리가 옛 볼륨 80 에서 -17~-18
    base_volume: 20        # 새 곡 시작 볼륨(= 옛 80 과 같은 크기)
    min_volume: 5          # -12dB 까지 줄인다
    max_volume: 100        # +14dB 까지 키운다
    sink_volume_pct: 160

wake:
  # 호출어(웨이크워드) 트리거 = '대기↔대화' 세션. false 면 항상 대화(옛 동작).
  # 목적: 부르기 전엔 LLM·TTS 안 돌려 쓸모없는 답변·자원 절약(교수님 요청).
  # 감지기 = livekit-wakeword 로 학습한 ONNX KWS(오디오 직접감지, app/wake_onnx.py).
  # 받아쓰기를 안 하므로 (a)'재하봇'이 OOV 라 뭉개지는 문제 (b)받아쓰는 4~6초 동안
  # 호출을 놓치는 문제가 둘 다 사라진다. 옛 STT 자모매칭은 폴백으로만 남음.
  # [[jaeha-bot-progress]]
  enabled: true
  detector: onnx       # onnx = 학습한 KWS 모델(권장) / stt = 옛 자모매칭(폴백)
  # 🔴 2026-08-25 '재하봇' -> '하이 티드'. 매칭어는 **공백을 뺀** 형태를 쓴다 —
  #    best_wake_ratio 가 인접 2토큰을 결합해 검사하므로 '하이 티드'도 이걸로 잡힌다.
  word: 하이티드
  preroll: 0.5         # 감지 직전 이만큼(초)을 보관해 '하이 티드 이거 뭐야?' 뒷말이 안 잘리게

  onnx:
    # Colab(livekit-wakeword)에서 학습한 3종 세트. push_model.sh 로 젯슨에 올린다.
    # v4(2026-08-10) = v3 의 증강 오류를 고쳐 재학습한 모델. 시간축(WSOLA·피치 유지)과
    #   피치축(길이 유지)을 **따로** 준 데이터로 배웠다. TTS·원본 음성·개수·학습설정은
    #   v3 와 동일 — 바뀐 건 증강뿐이라 결과 차이는 증강 탓으로 좁혀진다.
    # v1 은 models/wake/, v3 는 models/wake/v3/ 에 그대로 둔다 — 아래 두 줄만
    #   되돌리면 롤백된다. (멜·임베딩 onnx 는 셋 다 바이트 동일. 바뀐 건 분류기뿐:
    #   v1 dfe7b799 / v3 06e7c727 / v4 a649fe8d)
    # 🟢 2026-08-26 v6(하이 티드) 배포. v4 는 models/wake/v4/ 에 그대로 둔다 — 아래 두
    #   줄만 되돌리면 롤백된다. 단 **v4 는 옛 호출어('재하봇') 모델**이라 되돌릴 때는
    #   위 `word` 도 같이 되돌려야 한다(둘은 항상 같이 움직인다).
    # v6 는 시험 방식이 다르다: 학습에서 **화자를 통째로 뺐다**(M3 122Hz · F2+F5 258Hz).
    #   그래서 오프라인 재현율이 '외운 걸 다시 묻는' 값이 아니다.
    #   🔴 **v1~v5 의 재현율과 비교하지 말 것** — 호출어도 다르고(재하봇 vs 하이 티드)
    #      v1~v5 는 학습과 같은 화자로 쟀다(자기채점). 나란히 놓으면 틀린 결론이 난다.
    # 내보낸 것 검증(2026-08-26): 멜·임베딩은 v4 와 바이트 동일(고정 프론트엔드),
    #   분류기만 교체. app/wake_onnx.py 로 다시 채점해 Colab 값을 재현했다
    #   (전체 재현율 0.25/0.15/0.10/0.08/0.05/0.03 = 83/93/95/97/98/99%).
    model_dir: models/wake/v6
    classifier: jaehabot_v6.onnx
    # 임계값. v6 학습 검증(2026-08-26, 긍정 4020 · 부정 37278 = 20.71시간, 화자 홀드아웃):
    #   임계   재현율   헛후보/시간   최악 칸
    #   0.10   96.2%      1.93         85%
    #   0.08   96.9%      2.95         87%
    #   0.05   97.6%      6.95         92%   ← 채택
    #   0.03   98.4%     16.13         97%
    #
    # 왜 0.05 인가: 2단계 검증이 헛깨움을 맡으므로 1단계는 **놓치지 않는 쪽**으로 연다.
    #   v4 실기가 유튜브 켠 채 20회·시간이었으니 6.95 는 그 1/3 이다. 계산 부담은
    #   어느 값이든 문제가 안 된다(6.95 × 1.7초 = 시간당 12초, 0.3%).
    #   0.03 은 최악 칸이 더 좋지만 헛후보가 2.3배다 — **2단계를 뚫고 나오는 비율이
    #   아직 모르는 값**이라(합성 함정 40개 중 1개라는 작은 표본뿐) 거기까지 열지 않았다.
    # ⚠️ 이 헛후보율은 **말소리 부정문구** 기준이다. 실제 거실(TV·정적·음악)은 분포가
    #    달라 그대로 안 나온다. 실기 로그로 다시 잴 것.
    #
    # 🔴 재현율 평균은 실패를 숨긴다 — v3 가 여기 속았다(오프라인 91%, 실기에서 빠른
    #    발화 놓침). 그래서 격자 칸별로 따로 본다. v6 의 칸별(thr 0.05):
    #      최악 칸은 시간 1.25 / 피치 1.25 = 92%, 전체 98% 와 6%p 차 — 쏠림 없음.
    #    ⚠️ **판정은 반드시 실제로 쓸 임계값에서 할 것.** 같은 v6 가 0.25 에서는 최악
    #       칸 52% 라 노트북이 '배포하지 말 것'을 띄웠다. 0.05 에서 92% 로 올라간다 —
    #       모델이 못 알아본 게 아니라 **확신도가 낮았을 뿐**이었다.
    #
    # 🔴 아래 실음성 수치는 **v4 + 옛 호출어('재하봇')** 로 잰 것이다. v6 에 그대로
    #    적용되지 않는다 — 다시 재기 전까지는 '실음성이 합성음보다 훨씬 나쁘다'는
    #    사실만 가져다 쓸 것. (실음성 44건, 성인 남성, data/wake_real/)
    #      0.03 → 캐스케이드 재현율 80% / 1단계 후보 13.62회·시간
    #      0.05 → 64% / 5.78
    #      0.10 → 55% / 2.21
    #    합성음 97.6% ↔ 실음성 64% 의 간격이 이 프로젝트의 진짜 미지수다.
    #    학습 데이터에 실제 사람 목소리가 **한 건도 없다.**
    #
    # ⚠️ **verify.enabled 를 false 로 되돌릴 때는 이 값도 반드시 0.25 로 되돌릴 것.**
    #    안 그러면 1단계 혼자 시간당 7회 깨어난다. 두 줄은 항상 같이 움직인다.
    # 참고(비교 금지): v4 는 0.25→94.1%, v1 은 0.15→58%. 호출어도 시험 방식도 다르다.
    threshold: 0.05

    # ── 2단계 검증 (2026-08-12 추가) ────────────────────────────────────
    # 왜: 재현율과 헛깨움이 임계값 **하나**에 묶여 있었다. 낮추면 잡히지만 헛깨움이
    #     터지고 올리면 반대 — v3·v4·v5 는 전부 이 손잡이 위에서의 이동이었다.
    #     2단계는 둘을 분리한다. 1단계는 '놓치지 않는 것'만, 2단계가 '헛깨움'만 맡는다.
    #
    # 근거(실음성 44건, 성인 남성, data/wake_real/):
    #   1단계 임계별 재현율  0.25→30% / 0.15→45% / 0.10→55% / 0.05→66% / **0.03→82%**
    #     = 모델이 못 듣는 게 아니라 확신이 없다. 신호도 순서도 살아 있고 점수만 눌려 있다.
    #   2단계 통과율(자모컷 0.45)  힌트없음 41% / '재하봇' 64% / **문장형 98%**
    #     부정 통과는 2%(합성 부정 200개). 긍정 자모거리 중앙 0.00 / 부정 0.86.
    #   캐스케이드 실측(건별 AND)   또박또박 100% · 보통 90% · 빠르게 60% · 흘려서 60%
    #     = 전체 **30% → 80%**, 헛깨움 추정 0.47 → 0.27회·시간 (둘 다 좋아진다)
    #
    # 🔴 아직 검증 안 된 것: 위 헛깨움 0.27 은 **합성 부정(단어 한 개짜리) 기준 추정**이다.
    #    TV·대화·음악 등 실제 가정 소음은 전혀 안 들어갔다. 1단계가 시간당 13.6회 뜨므로
    #    2단계가 실제 소음을 못 거르면 그게 그대로 헛깨움이 된다. **실기 로그로 확인할 것**
    #    (기각 건은 [검증] 로 남는다).
    # ⚠️ 진짜 호출에 whisper 1회(+0.65s)가 더해진다.
    #
    # 롤백: enabled 를 false 로 되돌리고 위 threshold 를 0.25 로. 코드 경로가 완전히
    #       예전과 같아진다(verifier=None 이면 검증 버퍼를 읽지도 않는다).
    verify:
      enabled: true      # 2026-08-12 재개 — 두 번 대조로 환각을 막고 다시 켰다.
      # 🔴 2026-09-02 검증 방식. **기본 whisper = 현행 동작 그대로다.**
      #   whisper : 후보를 전사해 자모거리로 판정
      #   embed   : 임베딩 본보기와의 유사도로만 판정 — 로컬 STT 를 안 올려도 된다
      #             (전면 API/S2S 전환의 선결 조건. whisper 1.22초 -> 수 밀리초)
      #   both    : whisper 판정 + 기각분을 임베딩이 건짐(OR 보강)
      # ⚠️ embed 로 바꾸기 전에 반드시 embed_rescue.min_similarity 를 **거실 30~60분
      #    녹음**으로 다시 잡을 것. 지금 0.85 는 3분 표본이고, whisper 를 보강하던
      #    값이라 단독 관문의 요구와 다르다. 이 프로젝트는 같은 크기의 표본으로
      #    두 번 틀렸다(08-26 우회컷: 3분 최고 0.173 -> 같은 날 실기 0.725).
      #    절차는 docs/superpowers/plans/2026-09-02-embed-only-wake-verify.md Task 0.
      mode: whisper
      window_s: 2.0      # 검증에 넘길 최근 오디오. 프리롤(0.5)과 **별도 버퍼**다 —
                         # 프리롤을 늘리면 호출 직전 TV·부모 말소리가 섞여 환각한다.
      # 이 힌트가 결정적이다(41% → 98%). 검증에만 쓰고 대화 STT 에는 절대 쓰지 않는다.
      initial_prompt: "하이 티드, 하이티드야, 티드 불러."
      max_ratio: 0.45    # ② 힌트 주고 들었을 때의 자모거리 컷.
      # ① 힌트 **없이** 들었을 때의 컷 — 환각을 죽이는 진짜 관문이다.
      # 실측(2026-08-12, 유튜브 3분 + 실음성 44건). 이 값만 흔든 표:
      #   컷    진짜호출  또박  보통  빠르게 흘려서   유튜브후보
      #   0.55    55%    57%   80%   60%   20%      0%
      #   0.65    75%    79%   80%   70%   70%      0%   ← 채택
      #   0.75    93%   100%   90%   90%   90%      7%
      #   1.01    98%   100%  100%   90%  100%     47%   (= 대조 안 함 = 예전 상태)
      # 0.75 는 진짜 호출을 더 살리지만 유튜브가 새기 시작한다. 0.65 가 경계였다.
      #
      # 🟢 2026-08-25 호출어가 '하이 티드'로 바뀌며 이 표의 전제가 사라졌다.
      #    위 값들은 whisper 가 '재하봇'을 **못 읽는다**(힌트 없이 41%)는 사정에서 나온 것이다.
      #    합성 실측(36개, 12화자 × 속도 0.85/0.95/1.05): 자모거리 중앙 0.000 / 최대 0.222.
      #    즉 0.25 까지 조여도 100% 통과한다 — 옛 컷보다 2.6배 엄격하다.
      #    ⚠️ 다만 **전부 합성음**이다. 실음성에서는 '하이티드야' 같은 어미가 붙어 거리가
      #       늘 수 있어, 안전여유를 두고 0.35 로 시작한다.
      #
      # 🔴🔴 2026-08-27 0.35 -> 0.45. **"실음성 측정 뒤 0.25 로 조일 것"은 정확히 반대로
      #    틀렸다.** 젯슨 실기 80초, 재하님이 계속 부르는데 **통과 0건**이었다. 원인은
      #    whisper 가 못 알아들은 게 아니라 **컷이 0.03 차이로 좁았던 것**이다.
      #    whisper 는 '하이 티드'의 ㅌ 을 **일관되게 ㅊ 으로** 받아쓴다(합성음엔 없던 현상):
      #
      #      자모거리   전사                                        후보수
      #      0.38      하이치카·하이치테·하이치티·하이킥·하이픽        8
      #      0.44      하이치켓·하이키밤                             3
      #      ── 0.44 ~ 0.62 사이는 **완전히 비어 있다** ──
      #      0.62~1.00 아이차티·아이쿠·아이스크림·맛있게·안녕히계세요·(빈)  16
      #
      #    ✅ 어제 우회컷과 **반대 상황이다.** 우회컷은 소음(0.725)과 진짜(0.873)가 겹쳐
      #       못 옮겼다. 여기는 0.18 폭의 빈 구간이 실제로 있다 — 그래서 옮길 수 있다.
      #    🔴 **0.50 은 안 된다.** `하이`(0.50)·`티드`(0.50)·`아이디`·`하이볼`이 들어온다.
      #       "하이" 한 마디에 깨어나는 봇이 된다. 0.45 가 관측된 진짜 호출(최대 0.44)을
      #       전부 받으면서 그것들을 막는 유일한 자리다.
      #    ⚠️ 대가: `하이킥`(0.38)·`화이팅`(0.38)·`하이라이트`(0.40)가 TV 에서 나오면 뚫린다.
      #       지금 깨움 성공률이 **0%** 라 이 대가를 받는다 — 못 깨우는 게 더 치명적이다.
      #       **거실 소음 30~60분 녹음이 이 변경의 채점표다.** 헛깨움/시간을 재고 다시 정할 것.
      #    📌 표본은 한 세션(전사 13종)이다. 조일 때도 **실음성으로** 재고 조여라.
      plain_max_ratio: 0.45

      # ── 2패스를 껐다 (2026-08-26) ─────────────────────────────────
      # 힌트를 주고 한 번 더 듣던 관문(max_ratio)을 건너뛴다.
      #
      # 왜 있었나: '재하봇'은 OOV 고유명사라 힌트 없이는 41% 밖에 못 읽었다.
      # 왜 이제 없어도 되나: '하이티드'는 whisper 가 그대로 읽는다.
      #   실기 로그 전수 — 1패스 기각 58건 / 두 패스 다 돈 것 9건 /
      #   **2패스가 뒤집은 것 0건.** 정밀도는 전부 1패스가 만들고 있었다.
      # 비용: 성공한 호출마다 whisper 한 번 더 = **1.22초**. 깨어나는 데 2.53초가
      #   걸렸고 그 절반이 이것이었다(2026-08-26 15:37:22~24 실측).
      #
      # ⚠️ 호출어를 다시 OOV 고유명사로 바꾸면 이 관문이 필요해진다 — true 로 되돌릴 것.
      # ⚠️ 껐어도 아래 initial_prompt·max_ratio 는 지운다 못한다(되돌릴 때 쓴다).
      two_pass: false

      # ── 우회컷 (2026-08-26 추가) ──────────────────────────────────
      # 이 점수를 넘으면 whisper 를 부르지 않고 **바로 깨어난다.**
      #
      # 왜: 2단계가 진짜 호출을 죽이고 있었다. 실음성 20건 실측에서 1단계는 19/20 을
      #   잡는데 캐스케이드는 11/20 이다. 죽은 것 중엔 1단계 점수 **0.873** 짜리도
      #   있다 — whisper 가 '하이치 루' 로 읽어서 기각됐다(0.656 은 '화이팅').
      #   **모델이 확신하는 걸 ASR 이 뒤집는 건 이득이 아니다.**
      #
      # 안전한가: 실제 거실 녹음(유튜브 켠 3분, logs/noise_20260812_1349.wav)을 v6 로
      #   채점한 결과 **최고 점수가 0.173** 이었다. 임계별 사건(환산 회·시간):
      #     0.20 -> 0회   0.15 -> 20회   0.10 -> 40회   0.05 -> 160회
      #   즉 소음은 0.20 을 못 넘었다. 실음성 재현율은 11/20 -> 14/20 이 된다.
      #
      # 🔴🔴 **껐다 (2026-08-26 같은 날 실기로 기각).** 위 근거가 틀렸다.
      #
      #   0.173 은 3분 표본의 최고치였고, **전혀 대표성이 없었다.** 같은 날 유튜브를
      #   켜 놓고 실기를 돌리자 방 소음이 이렇게 올라갔다(logs/jaeha_20260826.log):
      #     14:53:53  0.482   |  14:53:55  0.630  |  14:53:56  0.725
      #   셋 다 whisper 가 ''(무음)으로 읽어 정상 기각했다. 즉 **2단계는 제 일을 했고,
      #   우회만이 새는 구멍이었다** — 그날 헛깨움 2건은 전부 우회로 들어왔다
      #   (0.283, 0.224). whisper 경로가 뚫린 건 **0건**이다.
      #
      #   소음 최고 0.725 ↔ 진짜 호출 최고 0.873. 두 분포가 거의 완전히 겹친다.
      #   ➡️ **안전한 우회컷은 존재하지 않는다.** 0.3 도 0.5 도 위 세 건을 통과시킨다.
      #      우회로 얻던 3건(11/20 -> 14/20)은 이 대가로는 살 수 없다.
      #
      #   ⚠️ 다시 켜려면 **먼저 방 소음 30~60분의 점수 분포를 보라.** 3분으로 정했다가
      #      틀렸다. 그리고 이 값은 진짜 호출 점수가 아니라 **소음 최고치**로 정한다.
      #
      # 1.01 = 꺼짐(점수는 1.0 을 못 넘는다).
      bypass_score: 1.01

      # 에너지 게이트 — **디지털 무음에 whisper 를 안 쓰기 위한 절약 장치**일 뿐이다.
      # 🔴 한때 기준을 max(소음바닥×2, 이 값) 으로 뒀다가 실기에서 진짜 호출을 막았다.
      #    유튜브를 틀면 소음 바닥이 0.005 -> 0.024 로 올라 기준이 0.0485 가 되는데,
      #    진짜 호출의 최대프레임 RMS 는 최소 0.0515 라 경계에 걸린다. 실제로 점수 0.103
      #    짜리 후보가 RMS 0.0344 로 잘려 나갔다(로그 2026-08-12 14:03:40).
      #    **시끄러울수록 귀를 닫는 설계였다** — 이제 바닥에 비례시키지 않는다.
      #    환각 방어는 게이트가 아니라 plain_max_ratio(두 번 대조)가 한다.
      min_rms: 0.005
      # 🔴 2026-09-19 뒷말(호출어 바로 뒤에 이어 말했나) 판정 기준. 위 min_rms(0.005)를
      #    같이 쓰다가 젯슨 방 소음(RMS ~0.007)이 그보다 커서 **호출어만 말해도 늘 이어짐**
      #    이었다 → 인사말 없이 호출어 소리가 대화로 넘어갔다. 고정값이다(바닥 비례 금지):
      #    방 소음 0.007·유튜브 0.024 위, 진짜 호출 최대프레임 최소 0.0515 아래.
      continue_min_rms: 0.03
      cooldown_s: 1.0    # 기각 후 최소 대기. 재무장 조건과 함께 whisper 폭주를 막는다.
                         # ⚠️ 검증이 **끝난** 시각부터 잰다(2026-08-27). 시작 기준이면
                         #    whisper 가 도는 1.2~2.0초가 쿨다운을 통째로 먹는다.

      # 🔴 2026-08-27 후보가 뜬 **그 순간**의 검증창은 호출어를 자르고 있을 수 있다.
      #    1단계는 '하이' 까지만 듣고도 임계(0.05)를 넘긴다. 그러면 창의 끝이 '티드'
      #    앞이라 whisper 가 그대로 '하이' 라고 받아쓰고, 자모거리 0.50 으로 기각된다.
      #    실기 로그 11:51:53 이 그것이다 — **점수는 0.272 로 높은데 전사가 '하이'**.
      #    사용자가 "1차 점수는 높은데 whisper 가 다르게 인식해 안 넘어간다"고 한 게 이 모양.
      #
      #    이만큼 더 듣고 나서 창을 뜬다. 검증창은 '최근 2초' 라 읽는 만큼 뒤로 따라온다.
      #    0.3초 = '티드' 한 음절이 들어오기에 충분하고(호출어 전체가 약 0.7~0.9초),
      #    프레임 3~4개라 읽는 것 자체는 순식간이다.
      #
      # ⚠️ **이 시간은 그대로 깨움 지연에 더해진다**(현재 약 1.3초 -> 1.6초).
      #    0 으로 두면 옛 동작이다 — 되돌리기는 이 한 줄.
      # ⚠️ 이건 아직 **가설이다.** 근거는 실기 전사 한 건('하이' 0.50)뿐이다.
      #    확인 방법: 이 값을 넣은 뒤 **'하이' 로만 전사되는 기각이 사라지는지** 본다.
      #    안 사라지면 원인이 창이 아니라 다른 데 있는 것이니 되돌릴 것.
      settle_s: 0.3
      # 🔴 2026-09-11 임베딩 대조 전용 — whisper 쪽(window_s·settle_s)은 안 건드린다.
      #   embed_window_s: 임베딩 창. 2.0초로는 임베딩 10개 < 대조가 요구하는 16개라 유사도가
      #     늘 0 이었다(봇의 임베딩 검증이 한 번도 통과 못 한 이유). 16개 = 2.48초 이상.
      #   embed_settle_s: 후보 뒤 임베딩만 더 듣는 시간. 0.5 -> 6프레임 = 0.48초(80ms 단위 내림).
      #     1단계 최고점이 첫 임계 넘김보다 0.3~0.5초 뒤라서다. 젯슨 A/B(호출 35·거실 45분):
      #     whisper 23/35·헛깨움 2회 vs 임베딩 0.85 25/35·1회 / 0.88 21/35·0회.
      #     reports/wake/ab_verify_20260911.md
      #   ⚠️ mode 가 whisper 이고 embed_rescue 가 꺼져 있으면 둘 다 안 쓰인다(지금 설정).
      embed_window_s: 3.0
      embed_settle_s: 0.5

      # 🔴 2026-08-27 기각된 후보를 소리로 남긴다. null = 끔.
      #    로그의 전사만으로는 **놓친 호출과 정상 기각을 구분할 수 없다.**
      #    실기 11:51:43 — 점수 0.459 인데 전사가 '안녕히계세요'(자모거리 0.79).
      #    이게 (a)내가 부른 걸 whisper 가 못 알아들은 건지 (b)정말 딴 소리였는지
      #    로그로는 영영 모른다. 들어 보면 1초에 끝난다.
      #    ⚠️ 켜 두면 디스크가 찬다(후보당 2초 = 128KB). **진단할 때만 켤 것.**
      #    끄기: null. 켜기: "~/wake_rejects" 처럼 경로를 준다.
      save_rejects_dir: null

      # ── 임베딩 대조 (2026-08-27 추가, 기본 꺼짐) ────────────────────
      # whisper 가 **소리와 무관한 글을 지어내서** 죽는 진짜 호출을 소리로 건진다.
      #
      # 왜: 2단계는 whisper 가 받아쓴 '글자'를 잰다. 그런데 whisper 는 자신 없는 짧은
      #   음성에 학습 때 외운 유튜브 자막 문구를 게워낸다. 실기 로그에 나온 목록이
      #   정확히 그것이다 — 안녕히계세요 · 고맙습니다 · 알겠습니다 ·
      #   다음 영상에서 만나요 · 오늘도 시청해주셔서 감사합니다.
      #
      # 🔴 '잘못 들었다'가 아니다. 증거가 디스크에 있다:
      #    data/wake_real/adult_20260826_1445/빠르게_00.wav 는 어른이 '하이 티드'라고
      #    부른 걸 녹음한 파일인데 whisper 는 '안녕히계세요' 라고 적는다(자모거리 0.79).
      #    ➡️ **자모컷을 어디로 옮겨도 못 고친다.** 글자가 소리와 무관하다.
      #
      # 무엇을: v6 이 이미 쓰는 embedding_model.onnx(96차원)로 후보를 벡터열로 만들고
      #   미리 녹음한 본보기와 코사인 유사도를 잰다. whisper 를 **대체하지 않는다** —
      #   OR 이다(whisper 통과 → 깨움 / whisper 기각 + 소리 일치 → 깨움).
      #   비용은 whisper 1.26초가 아니라 수 밀리초다.
      #
      # 실측(2026-08-27, 실음성 20건 + 거실 소음 3분. 소음은 1단계 후보 자리만 봤다):
      #     whisper 가 죽인 파일   전사          임베딩 유사도
      #     빠르게_00            안녕히계세요      0.884
      #     흘려서_00            화이팅           0.873
      #     흘려서_01            한시들           0.884
      #     흘려서_02            아주들           0.882
      #     흘려서_03            알아듣듀         0.878
      #     흘려서_04            안녕            0.842  <- 유일한 실패
      #     거실 소음 3분, 후보 자리 최대치        0.814
      #     컷 0.85 -> 진짜 **14/15**, 소음 0건 (같은 15건에 whisper 는 10/15)
      #   ⚠️ 여유가 얇다 — 소음 최대 0.814 ↔ 살린 것 중 최저 0.873, 폭 0.059.
      #
      # 🔴🔴 **그래서 기본이 꺼짐이다.** "3분 소음에서 0건"은 이 프로젝트가 이미 두 번
      #    속은 바로 그 증거다(08-26 우회컷: 3분 최고 0.173 -> 같은 날 실기 0.725).
      #    켜기 전에 **거실 30~60분**을 재고 컷을 다시 정할 것:
      #      python tools/enroll_wake.py --score-noise logs/거실녹음.wav
      #
      # ⚠️ **화자 종속이다.** 위 숫자는 등록한 사람과 시험한 사람이 같다. 다른 사람이
      #    부를 때도 되는지는 **아직 아무도 재지 않았다**(녹음이 한 사람 것뿐이었다).
      #    ➡️ 봇을 실제로 쓸 사람이 자기 목소리로 등록하는 것을 기본으로 삼는다:
      #      python tools/enroll_wake.py --record 10
      #
      # ⚠️ 모델(model_dir/classifier)을 바꾸면 본보기도 다시 만들어야 한다.
      #    규격이 안 맞으면 조용히 0 이 아니라 경고가 뜨고 대조를 건너뛴다.
      embed_rescue:
        enabled: false
        templates: models/wake/v6/templates_haitid.npy
        min_similarity: 0.85
      # 🔴 재무장 조건 ② — 직전 검증보다 이만큼 높은 점수는 '새 사건'으로 본다.
      #    조건 ①(점수가 임계 아래로 내려갔다 오기)만 두면 **소음 속에서 영영 재무장이
      #    안 된다.** 실기(2026-08-12 14:11): 유튜브가 계속 나와 점수가 0.05 아래로 안
      #    떨어지자, 첫 기각(0.060) 이후 최고 점수 **0.226 인 진짜 호출을 검증조차 안 했다.**
      #    "중간부터 불러도 인식이 안 된다"가 이것이었다.
      #    ⚠️ 너무 작게 두면 잔물결마다 whisper 를 불러 폭주로 되돌아간다.
      rearm_delta: 0.05
    # 연속 이만큼 임계를 넘어야 깨움(순간 잡음 차단용). 1프레임 = 80ms.
    # 2 로 두면 빠르게 말할 때 점수가 높은 구간이 짧아 연속 2회를 못 채우고 놓친다
    # (실기 관찰 2026-08-02: "천천히는 잘 되는데 빠르게 하면 안 됨"). → 1 로 완화.
    # ⏳ v4 는 빠른 발화를 제대로 학습했으므로 2 가 버틸 수 있다(헛깨움을 더 줄이는 카드).
    #    단 v4 실기가 통과한 '뒤에' 따로 바꿀 것 — 여기서 같이 바꾸면 원인을 못 가린다.
    trigger_frames: 1

  # 아래 2개는 detector: stt 폴백일 때만 쓰인다(ONNX 로드 실패 시 자동 폴백).
  threshold: 0.68      # 자모거리 컷. 실측(2026-07-27): 또박또박 0.25~0.57 / 무관어 0.71~1.0
  aliases: ["개하복", "제하모", "재하모사", "재보소"]  # 자주 나온 확정 오인식 → 즉시 깨움

  sleep_timeout: 30    # 대화 중 이만큼(초) 조용하면 다시 대기(잠듦)로
  # sleep_words: ["잘자", "바이바이"]   # 이 말 하면 즉시 대기로. 생략 시 wake.py 기본값 사용

metrics:
  # STEP 7 계측: 턴마다 단계별 지연·메모리를 logs/metrics_YYYYMMDD.jsonl 에 기록.
  # 젯슨 이식 '전' PC baseline 확보용(이식 후 같은 로깅으로 비교). 오버헤드 무시 수준.
  enabled: true
  tag: jetson      # 환경 표시. 이 파일이 젯슨 기준이라 기본값도 jetson 이다.
                   # 노트북은 configs/local.yaml 에서 pc 로 덮어쓴다.
                   # (2026-08-05 이전에는 기본이 pc 라 젯슨 실기 로그가 전부 pc 로 찍혔다.)

llm:
  # EXAONE-3.5-2.4B(한국어 특화, 반말 유리, 비상업 라이선스). llama-cpp 0.3.2 로드확인됨.
  model_path: models/exaone-3.5-2.4b-q4.gguf
  # ⛔ 옛 Qwen2.5-1.5B(models/llm-q4.gguf)는 2026-08-05 에 삭제했다(1.1GB).
  #    존댓말 문제로 교체한 뒤 한 번도 되돌린 적이 없다. 필요하면 HF 에서 다시 받을 것.
  fewshot_path: data/finetune_seed.jsonl  # few-shot 예시 소스(=QLoRA 데이터셋 씨앗과 동일 파일).
                                          # few_shot=true 항목만 매 요청 system 다음에 주입해 반말·2문장 말투 고정.
  # 🔴 2026-08-18 2048 -> 4096. **2048 이던 동안 로컬 폴백이 죽어 있었다.**
  #    08-11 에 안전 회귀를 잡느라 프롬프트를 1550 -> 3386자로 키웠는데 여기를 안 올렸다.
  #      ValueError: Requested tokens (2847) exceed context window of 2048
  #    폴백 예열은 경고 로그로만 나가는 자리라 **인터넷이 끊기는 날까지 안 보였다.**
  #    젯슨 실측(EXAONE-3.5 토크나이저): system 2356토큰 + 이력 6턴 + 답변 80.
  #    4096 이면 1300여 토큰 여유. 프롬프트를 또 키우면 tests/test_llm_context_budget.py 가 잡는다.
  n_ctx: 4096
  n_threads: 4
  # GPU 오프로드 레이어 수. -1=전체. Jetson(llama-cpp CUDA 소스빌드)에서 GPU 가속 켬.
  # PC(CPU 전용 빌드)에선 무시되어 무해(값 그대로 둬도 CPU로 돎). [[jaeha-bot-progress]]
  n_gpu_layers: -1
  max_tokens: 80                  # 두 문장 완결 보장(64는 긴답서 중간 잘려 미완결→TTS 뚝끊김). 길이는 프롬프트로 억제.
  seed: 777                       # 샘플링 시드 고정. 없으면 llama.cpp 가 매 실행 랜덤이라
                                  # 같은 질문에 답이 매번 다르고, 프롬프트 A/B 가 노이즈에 묻힌다
                                  # (2026-08-03: 같은 설정으로 평균 26.5~49.5자까지 흔들림을 확인).
                                  # TTS seed 와 같은 취지. null 이면 매번 랜덤.
  temperature: 0.3                # 작은 모델 헛소리↓(0.7->0.3 로 더 또렷하게)
  repeat_penalty: 1.1             # 1.3은 어미까지 억제+few-shot 문구 재사용 방해 → 1.1로 완화
  top_p: 0.9                      # 상위 누적확률 컷(또렷한 답)
  top_k: 40
  min_p: 0.05                     # 저확률 토큰 컷
  max_sentences: 2                # 완결문장 최대 개수(하드캡). 초과 시 사족 제거(agent._clamp_sentences)
                                  # ⚠️ 1 로 내리지 말 것 — A/B(2026-08-03) 결과 오히려 나빠진다.
                                  #    길이는 프롬프트('스무 글자 안팎')가 잡는다: 2문장 30.0자 vs 1문장 26.5자.
                                  #    3.5자(0.6초) 아끼는 대신 few-shot 이 가르친 뒷문장(놀이 제안)이 잘린다.
                                  #    실례: "토마토 끓이는 소리를 흉내내볼까?"(2문장 허용, 18자) 가
                                  #          "토마토 끓이는 건 재미있지만, 지금은 놀이로 접근해야겠어!"(1문장, 32자)보다 낫다.
                                  # ⚠️ max_tokens 도 80 유지 — 줄이면 첫 문장이 중간에 잘려 '뚝' 끊긴다
                                  #    (_clamp_sentences 는 종결부호가 있어야 자르므로 잘린 문장은 못 거른다).

  # ── 원격 백엔드(선택) ──────────────────────────────────────────────────────
  # backend: openai 로 바꾸면 gpt-4o-mini 가 답한다. .env 의 OPENAI_API_KEY 필요.
  # 실패하면 로컬 EXAONE 으로 자동 폴백한다(로그에 '폴백'이 찍힌다).
  # model_path 는 폴백용으로 계속 필요하니 지우지 말 것.
  #
  # 2026-08-10 젯슨 실측(안전 14문항 × 2회, 같은 프롬프트 2165자):
  #   로컬 EXAONE  중앙 1.769s / p95 3.138s   답변 40~50자가 흔함
  #   gpt-4o-mini  중앙 0.892s / p95 2.252s   답변 18~33자
  # ➡️ 0.88초 단축에 p95 까지 개선. 게다가 **길이 지시를 API 가 더 잘 따른다**
  #    (프롬프트 강화 뒤에도 남은 격차 — 2026-08-07 '지시 따르기' 항목).
  # 온도·top_p 등은 API 로는 보내지 않는다. tools/eval_llm.py 의 make_openai 와
  # 인자를 같게 맞춰야 평가에서 잰 품질·지연이 운영에서 그대로 재현된다.
  backend: local                  # local(llama.cpp·기본) | openai
  # 🔴 2026-08-19 신설. 기동 때 폴백 GGUF 를 미리 올릴지. **기본은 안 올린다.**
  #    젯슨 실측(앱 RSS 6,259MB 의 내역):
  #      whisper medium (CUDA)  1,881MB
  #      Supertonic (CUDA)      1,321MB
  #      EXAONE GGUF 폴백       2,319MB   <- 앱의 37%, 그런데 網이 죽어야 쓴다
  #    시스템 메모리가 7,348/7,607MB(96.6%)까지 차서 다음 최적화를 넣을 자리가 없었다.
  #    규칙(app/agent.py warm()):
  #      backend: local  -> 본진이므로 언제나 올린다
  #      원격 예열 성공   -> 안 올린다. 운영 중 원격이 실패하는 첫 턴에만 콜드 로드
  #      원격 예열 실패   -> 網 없이 켜졌다는 뜻 -> 그 자리에서 올린다
  #    ⚠️ true 로 되돌리면 2.3GB 를 다시 상시 점유한다. 메모리 넉넉한 기계에서만.
  preload_local: false
  api_model: gpt-4o-mini
  # 🔴 2026-08-18 3.0 -> 5.0. **3.0 은 타임아웃이 아니라 지연 증폭기로 작동하고 있었다.**
  #    위 08-10 표(중앙 0.892s / p95 2.252s)를 보고 정한 값인데, 08-18 재측정은:
  #      gpt-4o-mini  중앙 1.610s / p95 3.757s / 최대 4.444s   (재시도 끔)
  #      42자 프롬프트로 "안녕"만 물어도 1.735s = **순수 네트워크 왕복 바닥**
  #    회선 왕복이 2배가 되면서 타임아웃이 정상 분산 안으로 들어왔고, 문턱을 스친 호출마다
  #    SDK 기본 재시도(2회)가 붙어 **p95 13.233s** 가 됐다. 재시도는 app/agent.py 에서 껐다.
  #    5.0 = 관측 최대(4.444s) 바로 위. 정상 호출은 안 자르고 진짜 멈춤만 잡는다.
  # ⚠️ **프롬프트 길이는 지연과 무관하다**(2165자 vs 4185자 A/B, 차이 -0.23s = 노이즈).
  #    느리다고 프롬프트를 깎지 말 것 — 깎이는 건 안전 규칙이고 얻는 건 0 이다.
  # 🔴 이 값 = 네트워크가 죽었을 때의 침묵 길이다
  # (타임아웃 뒤 로컬이 1.7초를 더 쓰므로 총 침묵 ≈ api_timeout + 1.7s).
  api_timeout: 5.0
  # ⚠️ 폴백은 기동 때 agent.warm() 으로 예열해 둔다(main.build_pipeline).
  #    예열이 없으면 첫 폴백이 7.18s, 로드만 예열해도 여전히 7.18s —
  #    비용은 로드가 아니라 첫 추론(prompt eval + CUDA 초기화)이었다. 예열 후 4.1s / 정상 1.7s.

# ============================================================
# 필러(맞장구) — 침묵을 줄이는 장치. **실지연은 안 줄인다.**
# ------------------------------------------------------------
# 진짜 답이 나오는 시각은 1ms 도 안 바뀐다. 바뀌는 건 아이가 처음 소리를 듣는
# 시각뿐이다(체감 4.17 -> 1.70초).
#
#   지금        아이 말 끝 |-------- 4.17초 침묵 --------| "그건 말이야…"
#   필러 넣으면  아이 말 끝 |-1.70s-|"음~"|-- 2.47초 --| "그건 말이야…"
#
# 🔴 가장 큰 값어치는 **재발화 차단**이다. 침묵이 길면 아이는 "티드?" 하고 다시
#    부르는데, 그 시점엔 listen() 이 끝나 봇이 안 듣고 있고 drain() 이 쓸어낸다 —
#    아이가 다시 말한 것이 통째로 사라진다. 빠른 맞장구가 그걸 막는다.
# ⚠️ 자유대화(LLM) 턴에만 나간다. 놀이는 상태머신 즉답(총 2.4초)이라 필러가
#    오히려 답을 늦춘다. app/main.py _respond() 참조.
# 설계: docs/superpowers/specs/2026-08-25-filler-design.md
# ============================================================
filler:
  enabled: true
  # 같은 소리가 연달아 안 나오게 직전 것을 피해 고른다. 5~6개면 충분히 안 질린다.
  # 🔴 늘어진 모음은 "~" 가 아니라 "..." 으로 적는다. Supertonic 은 "오~" 를 **피크의
  #    40.9% 에서 그대로 멈춰** 말끝이 뚝 끊긴다(감쇠 40ms). "오..." 로 적으면 스스로
  #    맺는다(140ms, 포락선 28.0 -> 15.4 -> 2.1 -> 0.8). 2026-08-26 실측.
  #    ⚠️ "오~." 처럼 뒤에 점 하나만 붙이는 건 무효다 — 파형이 "오~" 와 완전히 같다.
  # ⛔ "응, 응" 은 뺐다(2026-08-26). 쉼표로 끊긴 두 음절이라 **뒤 음절이 통째로 잘려**
  #    젯슨에서 유독 티가 났다. tail_pad_s 를 0.6 까지 올려도 안 살아났다.
  # ⛔ "그래?" "아..." "오..." 도 뺐다(2026-08-26 젯슨 청취). 살아남은 건 `음...`·`어...`
  #    둘뿐이다 — 잘림이 아니라 **소리 자체가 어색**하다는 판단이다.
  #    다음절·다른 모음 필러를 다시 넣으려면 젯슨에서 먼저 들어볼 것.
  # ⚠️ 2 개뿐이면 _pick_index 가 **엄격히 번갈아** 낸다(음… 어… 음… 어…). 무작위가
  #    아니라 예측 가능한 왕복이 된다 — 아이가 눈치채면 그때 하나 더 넣을 것.
  phrases: ["음...", "어..."]
  # 필러를 이만큼 미뤄서 낸다(초). 0.0 = 즉시.
  # 🔴 2026-08-26 사용자 요청으로 0.0 -> 0.6. "연결어가 좀 더 나중에, TTS 와 붙어서".
  # 상한 계산: 가장 긴 필러 `아...` 의 말소리가 버퍼 0.91s 에 끝나고, 답이 가장 빨리
  #   나오는 턴은 1.72s 다(젯슨 실측 생각 최소 1.27s + TRT 합성 0.45s).
  #   -> delay + 0.91 < 1.72, 즉 **상한 0.81**. 0.7 이면 최악의 턴에 0.11s 여유
  #   (보통 턴은 답이 2.20s 라 0.59s 여유). 0.6 이던 것을 사용자 요청으로 0.7 로.
  # ⚠️ 0.11s 는 얇다. 답이 내 추정보다 빠른 턴이 있으면 필러 말끝이 잘린다 —
  #    실기에서 그렇게 들리면 0.6 으로 되돌릴 것.
  # ⚠️ 상한을 넘기면 필러가 말하는 도중에 답이 들어와 **필러가 중간에 잘린다**.
  #    답 자체가 잘리는 사고는 filler._emit 의 is_playing 가드가 막는다(이미 소리가
  #    나고 있으면 필러를 버린다) — 그래서 더 밀어도 최악은 '필러가 안 나옴'이다.
  delay_s: 0.7
  # 🔴 말끝 뒤에 구워 넣는 무음(초). **앞(0.15)과 따로다.**
  #    2026-08-26 젯슨 청취: `응, 응` 만 유독 끊기고 나머지는 살짝 끊긴다. 필러들의 꼬리
  #    무음이 472~719ms 인데도 그러니, 장치가 끝에서 그만큼 흘린다는 뜻이다 — 단모음은
  #    여운 끄트머리만 잃어 '살짝'이고 `응, 응` 은 쉼표 뒤 음절을 통째로 잃는다.
  # ✅ 필러의 뒤 무음은 **공짜다**(논블로킹이고 어차피 진짜 답이 덮어쓴다). 아낄 이유가 없다.
  tail_pad_s: 0.6
  # 🔴 답이 필러 말끝을 기다려 주는 상한(초). 2026-08-26 추가.
  #    delay_s 를 답에 붙일수록(0.7) 답이 필러 말하는 도중에 나오는데, `sd.play` 는
  #    앞 재생을 닫으므로 **필러가 말하다 말고 잘린다** — 사용자가 들은 그 '뚝'이다.
  #    답이 이만큼까지 기다렸다 이어받으면 이음매가 사라진다.
  # ⚠️ 말소리만 기다린다(꼬리 무음 0.6s 는 안 기다린다 — 아무도 못 듣는다).
  #    보통 턴은 필러가 이미 끝나 있어 **실제 대기는 0** 이다. 답이 추정보다 빠른
  #    턴에서만 이 값만큼 답이 늦어진다. 0 으로 두면 이 기능이 꺼진다.
  max_await_s: 0.5
  # 목소리·speed·확산스텝·문구·음량기준·앞뒤무음이 바뀌면 키가 달라져 자동으로 다시 굽는다.
  cache_dir: "~/.cache/jaeha_filler"

# 2026-09-16 전면 API(Realtime) 대화 경로 — docs/superpowers/specs/2026-09-16-realtime-pipeline-design.md
#   local    : app.main (호출어 → faster-whisper → gpt → Supertonic). 보고서가 서술하는 경로.
#   realtime : app.main_realtime (호출어 → OpenAI Realtime). 젯슨 local.yaml 에서만 켠다.
pipeline: local
realtime:
  model: gpt-realtime-mini          # 40턴 월 21,200원(gpt-realtime 73,300원) — report 7.2
  voice: marin                      # 09-07 블라인드
  speed: 1.05                       # 09-19 젯슨 라이브에서 marin 1.05 선택. API 허용 0.25~1.5
  transcribe_model: gpt-4o-transcribe   # whisper-1 은 아동 발화 39% 빈 문자열
  silence_ms: 1200
  mic_pad_s: 0.15
  history_turns: 6
  filler_after_s: 0.7
  response_timeout_s: 8
  wake_listen_s: 8
  voice_cache_dir: ~/.cache/jaeha_voice
  # 🔴 2026-09-21 안전 막기·정정·끊김 복구(spec 2026-09-21-realtime-guard-design.md)
  guard:
    hold_on_risk: true      # 아이 말에 위험 신호가 있으면 답 소리를 붙잡고 글자를 다 본 뒤 낸다
    hold_cap_s: 3.0         # 붙잡기 한도 — 넘으면 거기까지 보고 흘려보낸다
    reconnect_tries: 3      # 끊기면 말없이 다시 붙기(0.5 → 1 → 2초)
    safe_line: "그건 위험해! 엄마 아빠한테 같이 가자."
    cant_line: "아, 그건 아직 못 해. 대신 동물 소리 놀이 할까?"
