# 모델 경로 및 런타임 설정 (가이드 5: 8GB 안 안정 구동 우선)
#
# ⚠️ 이 파일은 **젯슨(운영) 기준값**이다. push_code.sh 가 configs/ 를 젯슨에 밀어넣어
#    두 기계가 이 한 벌을 공유한다. 노트북처럼 값이 달라야 하는 기계는 이 파일을 고치지 말고
#    `configs/local.yaml`(git 미추적·push 제외)에 바뀔 키만 적는다. 예시: configs/local.example.yaml
#    여기를 직접 고치면 push 할 때 젯슨 설정이 함께 망가진다.
stt:
  # 순정 다국어 whisper-small. 2026-08-04 ablation(AI-Hub #003, 9세 148발화)에서
  # 한국어 파인튜닝판(SungBeom/whisper-small-ko)보다 명백히 우수해 되돌림:
  #
  #   구성                          CER    심각실패  폭주  답변률   RTF
  #   순정 small + 아래 디코딩      7.50%     0건    0건   100%   0.363   ← 채택
  #   ko 파인튜닝 + 디코딩 + 가드   7.23%     4건    0건  89.2%   0.431
  #   ko 파인튜닝 + 디코딩         31.12%    18건   10건   100%   0.539
  #   ko 파인튜닝 + 순정 디코딩    28.68%    32건    4건   100%   1.193
  #
  # 🔴 핵심: 반복 환각(폭주)의 원인은 ko 파인튜닝 모델 자체였다. 순정은 폭주 0건이다.
  #    beam_size·no_repeat_ngram·temperature 캡·dedupe·글자수 가드는 전부 그 상처를
  #    덮는 장치였고, 순정에선 그런 보정 없이도 무너지지 않는다.
  #    같은 발화 대조: "저는 멜슨 만델라를 존경해요" → ko 폭주 / 순정 CER 0%.
  # 🔴 답변률이 중요하다. ko+가드는 CER 이 낮아 보이지만 16건(10.8%)을 버려 되묻는다.
  #    순정은 148건 전부 답하면서 7.50%. 대화 로봇에선 이쪽이 낫다.
  # ⚠️ 이 비교는 9세 음성 기준. 실제 3세 녹음이 생기면 다시 확인할 것.
  # ── 모델 선택 (2026-08-05 젯슨 GPU 스윕, 148발화 동일조건 실측) ────────────
  #   모델              CER     완벽일치  발화당   체감대기*  동시적재여유
  #   small            7.27%    52.7%    0.61s    2.27s      2.88GB
  #   medium           4.21%    71.6%    1.32s    2.97s      2.23GB
  #   large-v3-turbo   2.96%    78.4%    1.59s    3.24s      1.99GB   ← 현재
  #   * 체감대기 = 인식 + 생각(1.65s). TTS 재생은 봇이 말하는 시간이라 제외.
  #
  # turbo 채택 이유: small 대비 CER 59% 감소(오인식 4번중 1번 -> 1번중 0.2번).
  #   비용은 +0.98s 뿐이고, 이 값도 아침의 ko 파인튜닝(8.69s)보다 5배 빠르다.
  #   지금 수치는 9세 기준인데 실제 대상인 2~3세는 모든 모델이 나빠지므로,
  #   입력이 어려울수록 모델 여유분이 더 중요하다.
  # ⚠️ 최종 확정은 LLM API 전환 후로 미룸 — 생각(1.65s)이 줄면 STT 예산이 늘어
  #   선택이 달라질 수 있다. 그때 아래 세 줄을 바꿔가며 재판단할 것.
  # 셋 다 STT+TTS+LLM 동시적재 OOM 여유 충분. 캐시 후 로드는 4초.
  model_size: large-v3-turbo
  # model_size: medium    # 3초 목표를 엄격히 지킬 때(2.97s). 그래도 CER 42% 감소
  # model_size: small     # 최속(0.61s). 지연이 최우선일 때
  # ⛔ 옛 한국어 파인튜닝판(models/whisper-small-ko-ct2)은 2026-08-05 에 삭제했다.
  #    폭주의 원인이라 되돌릴 이유가 없다. 필요하면 HF 의 SungBeom/whisper-small-ko 를 다시 변환할 것.
  # ✅ 2026-08-05: ctranslate2 를 CUDA 로 소스빌드해 GPU 사용 가능해짐(cuda_device_count=1).
  #    젯슨 실측(같은 12발화): CPU 3.06s/발화 -> GPU 0.65s/발화 (RTF 0.686 -> 0.145, 4.7배).
  #    인식 결과는 CPU 와 글자 단위로 동일 — float16 로 인한 품질 손실 없음.
  #    빌드: ~/.local/ct2 에 설치, conda activate.d/zz_ld.sh 가 LD_LIBRARY_PATH 를 잡아준다.
  #    ⚠️ 노트북(CPU 전용 휠)에서는 cuda 로 두면 죽는다. → 이 줄을 고치지 말고
  #       configs/local.yaml 에 `stt: {device: cpu}` 를 둘 것(기계별 오버레이).
  #    롤백: device 를 cpu 로. 휠 되돌리려면 ~/ct2_rollback/*.whl 을 force-reinstall.
  device: cuda
  compute_type: float16   # GPU 표준. int8 은 GPU 에서 이득이 적고 품질만 손해.
                          # 메모리가 빠듯하면 int8_float16 을 검토할 것.
  cpu_threads: 6          # 젯슨 6코어 전부 사용. 기본값(4)이면 2코어가 논다.
                          # 실측(2026-08-03, 1.6초 오디오): 4.56s -> 3.84s. 인식 결과는 동일.
                          # PC 코어가 적으면 줄일 것(초과 지정은 경합으로 오히려 느려짐).
  silence_duration: 1.2   # 말 끝난 뒤 이만큼 조용하면 종료(초).
                          # 실아동 음성(AI-Hub 108, 9세 600개) VAD 분석(2026-07-23): 문장 내부
                          # 멈칫이 1.0초면 9세도 3.7% 잘림, 1.2초면 2.2%. 3세는 더 오래 멈칫하니
                          # 1.0->1.2 로 올림(잘림↓, 지연 +0.2s). 최종값은 실제 3세 녹음 때 확정.
  # 반복 환각 가드. Whisper 가 정답을 맞힌 '뒤'에 학습문장 잔해를 끝없이 덧붙이는 폭주를 막는다
  # ("...입도 작아요" + "일찍 일찌 일참 일찀 일찱..."). 매 토큰이 달라 dedupe_repeats 가 못 잡고,
  # 매 3-gram 이 달라 no_repeat_ngram_size 도 못 잡는다. 그래서 '말속도'로 자른다.
  # 실측(2026-08-04, AI-Hub #003 9세 148발화): 가드 없으면 CER 31.1%, 12.2%가 심각 붕괴(최악 1200%).
  #   임계 6.0 -> CER 7.13%, 재질문 12.2%
  #   임계 7.0 -> CER 9.52%, 재질문 7.4%(오탐 0)
  #   임계 4.5 -> CER 4.90% 지만 재질문 27% — 4번에 한 번 되물어 대화가 안 됨
  # ➡️ 순정 small 로 되돌린 뒤에는 폭주 자체가 0건이라 가드는 '보험'으로만 남는다.
  #    순정 출력에 임계 6.0 을 걸면 148건 중 1건이 걸리는데 그것도 오탐이었다
  #    (빠르게 말한 정상 발화 "내 생일이 빨리 왔으면 좋겠어요…" 22자/3.2초=6.88글자per초).
  #    정답 말속도 최대가 6.88 이므로 7.0 이면 오탐 0 이면서 보험은 유지된다. → 7.0 채택.
  # ⚠️ 이 값은 9세 기준이다. 유아는 더 천천히 말해(=글자/초가 낮아) 오탐이 줄 것으로 보이나,
  #    실제 3세 녹음으로 반드시 다시 잡을 것. 정답 말속도 실측: 중앙값 3.03 / p95 5.44 / 최대 6.88.
  max_chars_per_sec: 7.0
  # 이 길이(공백 제외 글자수) 미만은 아무리 빨라도 버리지 않는다. 짧은 유아 발화 보호용
  # ("이거 뭐야" 처럼 짧고 빠른 정상 발화가 임계를 넘는다). 진짜 폭주는 본질적으로 길다 —
  # 실측 폭주 출력 최소 16자/중앙값 28자, 임계를 넘긴 폭주는 전부 20자 이상이었다.
  # 20 을 두면 오탐 4건 -> 2건, 진짜 검출은 14건 그대로. null 대신 0 으로 꺼짐.
  min_chars_to_reject: 20
  # 오인식 사후 교정: 고유명사(봇/아이 이름)는 Whisper 학습에 없어 발음대로 적힘(재하봇->재하보사).
  # keywords 와 자모 편집거리가 가까운 토큰을 그 단어로 교정(app/text_norm.py). 오탐 적음.
  keywords: ["재하봇", "하연"]
  aliases:                # 자주 나오는 확정 오인식만 정확 매핑(빠르고 100%). 실기서 새 오인식 나오면 추가.
    제아부사: 재하봇
    재아부사: 재하봇
  # initial_prompt: "재하봇과 하연이의 대화."  # Whisper 원천 힌트. 환각 위험 있어 기본 off.
  #                                          # 마이크 생기면 켜서 '재하봇' 인식 개선 vs 환각을 실측 후 결정.

tts:
  # Supertonic-3 (ONNX, 경량, OpenRAIL-M). 모델은 첫 실행 시 HF 자동 다운로드.
  model: supertonic-3
  voice: F1+F4         # F1·F4 균등 블렌딩(밝고 자연스러운 유아용 커스텀 보이스, 청취 비교로 채택).
                       # '+' 로 이으면 tts_module._resolve_style 가 style 벡터를 평균냄. 단일은 F1~F5/M1~M5.
  language: ko
  speed: 1.05          # 모델 학습 sweet spot(=자연스러움 기본값). 1.0 은 살짝 처져 우울하게 들려 1.05 로.
  total_steps: 12     # 확산 스텝↑ = 음색 다듬음. Jetson 속도 위해 16->12(살짝↓, 음질 미세차).
                      # 더 빠르게 필요하면 8(품질 더↓), 음질 최우선이면 16.
  threads: 4          # onnxruntime intra-op 스레드. 실측 최적(6/8은 경합으로 느려짐)
  # onnxruntime 실행 프로바이더. supertonic 기본값은 CPU 하나뿐이라 젯슨 GPU 가 놀았다.
  # 노트북엔 CUDA 가 없으므로 자동으로 CPU 로 내려간다(경고 없음) — 같은 파일을 공유해도 안전.
  # TensorRT 는 첫 실행 때 엔진을 빌드하느라 콜드 스타트가 훨씬 길어져 일단 제외.
  providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  seed: 777           # diffusion 노이즈 시드 고정 -> 말투·속도 일정. F1/777 이 밝은 톤이라 채택(청취 비교).
                      # 캐릭터 바꾸려면 다른 정수(1234/7/42/2024 등). null 이면 매번 랜덤.
  gap: 0.2            # 문장 사이 무음(초). 앞뒤 pad 합쳐 총 간격≈0.3s(TTS 표준). 붙이려면 0.15, 띄우려면 0.3

  # ── 원격 백엔드(선택) ──────────────────────────────────────────────────────
  # backend: openai 로 바꾸면 gpt-4o-mini-tts 로 말한다. .env 의 OPENAI_API_KEY 필요.
  # 실패하면(네트워크·키·타임아웃) 자동으로 Supertonic 으로 내려간다 — 로그에 '폴백'이 찍힌다.
  #
  # 2026-08-10 젯슨 실측(안전 14문항 × 2회):
  #   Supertonic 첫 소리 0.901s (최대 0.988s — 거의 안 흔들린다)
  #   OpenAI     첫 바이트 0.970s / 최대 2.242s (28턴 중 2턴이 1.7s 초과)
  # ➡️ 지연 이득은 없다. 바꾸는 이유는 **목소리**다(청취 비교로 shimmer 채택).
  # ⚠️ 아직 통짜로 받아 재생하므로 실제 첫 소리는 '다운로드 완료' 시각이다.
  #    스트리밍 재생(response_format=pcm)으로 바꾸면 더 줄일 여지가 있다.
  backend: supertonic          # supertonic(로컬·기본) | openai
  openai_model: gpt-4o-mini-tts
  openai_voice: coral          # 청취 비교로 채택. shimmer 로 바꾸면 조금 더 차분하다
  # 톤·속도 지시 — Supertonic 의 speed 에 해당하는 유일한 손잡이다(tts-1 계열은 못 받는다).
  # ⚠️ 손잡이가 헐겁다: 같은 지시문인데 목소리만 바꿔도 같은 문장이 3.05s / 4.50s 로 갈렸다.
  #    숫자로 정확히 잡히지 않으니 바꿀 때마다 귀로 확인할 것.
  # 이력: "천천히"를 넣었더니 답답하다는 평(2026-08-10). 빼면 오히려 길어져서,
  #       '들뜬 아이 친구처럼 빠르게'가 가장 생기 있고 짧았다.
  openai_instructions: "신나서 들뜬 아이 친구처럼 빠르게, 통통 튀게 말해줘."
  openai_timeout: 3.0          # 실측 p95 1.72s / 최대 2.24s → 3초를 넘으면 로컬이 더 빠르다
  # 조각이 오는 대로 재생해 첫 소리를 앞당긴다(통짜 수신 1.25s → 0.6s대 기대).
  # 🔴 소리가 나가기 시작하면 폴백이 불가능하다. 중간에 끊기면 말이 잘린 채 끝나고
  #    로그에 '말이 잘렸다'가 남는다. 안정성을 최우선하려면 false(통짜 수신).
  openai_stream: true

vision:
  model_path: models/yolov8n.pt   # nano 모델로 시작

audio:
  # 마이크/스피커 장치(이름 부분일치). null 이면 시스템 기본.
  # Jetson: 기본 'default'(pulse)가 HDMI로 새서 멈춤 → USB ReSpeaker 를 콕 집음.
  # PC 는 보통 null(기본)로 충분. 실물 장치 바뀌면 이 이름만 수정.
  device: ReSpeaker

wake:
  # 호출어(웨이크워드) 트리거 = '대기↔대화' 세션. false 면 항상 대화(옛 동작).
  # 목적: 부르기 전엔 LLM·TTS 안 돌려 쓸모없는 답변·자원 절약(교수님 요청).
  # 감지기 = livekit-wakeword 로 학습한 ONNX KWS(오디오 직접감지, app/wake_onnx.py).
  # 받아쓰기를 안 하므로 (a)'재하봇'이 OOV 라 뭉개지는 문제 (b)받아쓰는 4~6초 동안
  # 호출을 놓치는 문제가 둘 다 사라진다. 옛 STT 자모매칭은 폴백으로만 남음.
  # [[jaeha-bot-progress]]
  enabled: true
  detector: onnx       # onnx = 학습한 KWS 모델(권장) / stt = 옛 자모매칭(폴백)
  word: 재하봇
  preroll: 0.5         # 감지 직전 이만큼(초)을 보관해 '재하봇 이거 뭐야?' 뒷말이 안 잘리게

  onnx:
    # Colab(livekit-wakeword)에서 학습한 3종 세트. push_model.sh 로 젯슨에 올린다.
    # v4(2026-08-10) = v3 의 증강 오류를 고쳐 재학습한 모델. 시간축(WSOLA·피치 유지)과
    #   피치축(길이 유지)을 **따로** 준 데이터로 배웠다. TTS·원본 음성·개수·학습설정은
    #   v3 와 동일 — 바뀐 건 증강뿐이라 결과 차이는 증강 탓으로 좁혀진다.
    # v1 은 models/wake/, v3 는 models/wake/v3/ 에 그대로 둔다 — 아래 두 줄만
    #   되돌리면 롤백된다. (멜·임베딩 onnx 는 셋 다 바이트 동일. 바뀐 건 분류기뿐:
    #   v1 dfe7b799 / v3 06e7c727 / v4 a649fe8d)
    model_dir: models/wake/v4
    classifier: jaehabot_v4.onnx
    # 임계값. v4 학습 검증(2026-08-10, 긍정 5448·부정 21.3시간) 실측:
    #   0.50 → 재현율 89.8% / 오작동 0.00회·시간
    #   0.30 → 재현율 93.1% / 오작동 0.38
    #   0.25 → 재현율 94.1% / 오작동 0.47      ← 유지(v3 와 같은 값)
    #   0.20 → 재현율 94.9% / 오작동 0.56
    #   0.15 → 재현율 95.7% / 오작동 0.80
    #
    # 🔴 이 재현율은 **평균**이다. v3 가 정확히 여기에 속았다 — 오프라인 91% 로 통과하고
    #    실기에서 빠른 발화를 놓쳤다. 그래서 v4 는 격자 칸별로 따로 채점했다(thr 0.25):
    #      시간 1.0  / 피치 1.0 · 1.15 · 1.35   93% · 95% · 92%   ← 피치는 이제 무관
    #      시간 1.15 / 피치 1.0                 90%
    #      시간 1.25 / 피치 1.25                82%
    #      시간 1.35 / 피치 1.0 · 1.15          67% · 65%          ← 여전히 약한 칸
    #    ✅ 노린 것(축 분리)은 됐다. 피치를 바꿔도 점수가 안 흔들린다(편차 3%p).
    #    ⚠️ 그러나 시간축 자체가 아직 약하다(편차 26%p). 1.25 까지는 버티고 1.35 에서 무너진다.
    #       빠른 발화는 v3 54% -> v4 67% 로 올랐을 뿐 해결은 아니다.
    #       ➡️ 실기에서 빠르게 10회 중 5회 이하면 다음 수는 임계값이 아니라 **실음성 녹음**이다.
    #          데이터는 모자라지 않다(7칸 고르게 뽑음) — 합성음 배속과 진짜 빠른 말이 다른 것이다.
    #
    # 🔴 실기 1차(2026-08-09 20:44, v3) — 오프라인 수치가 실제와 다르다는 게 확인된 기록:
    #      호출 성공 0.402 / 대기 중 다른 소리 0.285 · 0.243 (간격 0.12뿐)
    #    v4 는 같은 임계(0.25)에서 오작동이 오히려 낮으므로(thr 0.50 기준 0.09 -> 0.00)
    #    헛깨움도 함께 줄 것으로 본다. 단 실기 로그로 확인 전에는 추정이다.
    #
    # ⚠️ 임계값은 **바꾸지 않는다**. v3 와 같은 0.25 로 둬야 실기 차이를 온전히 모델 탓으로
    #    돌릴 수 있다. 한 번에 변수 두 개를 바꾸면 또 원인을 못 가린다.
    # 참고 v1: 0.30→49% / 0.20→55% / 0.15→58%(구 채택값) — 시험지가 달라 직접 비교는 무의미.
    # 🔴 2026-08-12: 2단계 검증을 켜면서 0.25 -> 0.03 으로 내렸다가, 실기에서
    #    헛깨움이 늘어 **0.05 로 되올렸다**. 1단계는 '놓치지 않는 것'만 담당하되
    #    후보를 무한정 만들면 2단계가 감당을 못 한다(1단계 후보율 13.6 -> 5.8회·시간).
    #
    #    실음성 44건 기준 캐스케이드 재현율 ↔ 1단계 후보율(합성 부정 기준):
    #      0.03 → 80% / 13.62회·시간
    #      0.05 → 64% /  5.78회·시간   ← 채택. 옛 단일단계(30%)의 2배는 유지한다
    #      0.10 → 55% /  2.21회·시간
    #    ⏳ 실기 로그(logs/jaeha_*.log)의 [검증] 줄을 세어 다시 정할 것.
    #
    # ⚠️ **verify.enabled 를 false 로 되돌릴 때는 이 값도 반드시 0.25 로 되돌릴 것.**
    #    안 그러면 1단계 혼자 시간당 5.8회 깨어난다. 두 줄은 항상 같이 움직인다.
    threshold: 0.05

    # ── 2단계 검증 (2026-08-12 추가) ────────────────────────────────────
    # 왜: 재현율과 헛깨움이 임계값 **하나**에 묶여 있었다. 낮추면 잡히지만 헛깨움이
    #     터지고 올리면 반대 — v3·v4·v5 는 전부 이 손잡이 위에서의 이동이었다.
    #     2단계는 둘을 분리한다. 1단계는 '놓치지 않는 것'만, 2단계가 '헛깨움'만 맡는다.
    #
    # 근거(실음성 44건, 성인 남성, data/wake_real/):
    #   1단계 임계별 재현율  0.25→30% / 0.15→45% / 0.10→55% / 0.05→66% / **0.03→82%**
    #     = 모델이 못 듣는 게 아니라 확신이 없다. 신호도 순서도 살아 있고 점수만 눌려 있다.
    #   2단계 통과율(자모컷 0.45)  힌트없음 41% / '재하봇' 64% / **문장형 98%**
    #     부정 통과는 2%(합성 부정 200개). 긍정 자모거리 중앙 0.00 / 부정 0.86.
    #   캐스케이드 실측(건별 AND)   또박또박 100% · 보통 90% · 빠르게 60% · 흘려서 60%
    #     = 전체 **30% → 80%**, 헛깨움 추정 0.47 → 0.27회·시간 (둘 다 좋아진다)
    #
    # 🔴 아직 검증 안 된 것: 위 헛깨움 0.27 은 **합성 부정(단어 한 개짜리) 기준 추정**이다.
    #    TV·대화·음악 등 실제 가정 소음은 전혀 안 들어갔다. 1단계가 시간당 13.6회 뜨므로
    #    2단계가 실제 소음을 못 거르면 그게 그대로 헛깨움이 된다. **실기 로그로 확인할 것**
    #    (기각 건은 [검증] 로 남는다).
    # ⚠️ 진짜 호출에 whisper 1회(+0.65s)가 더해진다.
    #
    # 롤백: enabled 를 false 로 되돌리고 위 threshold 를 0.25 로. 코드 경로가 완전히
    #       예전과 같아진다(verifier=None 이면 검증 버퍼를 읽지도 않는다).
    verify:
      enabled: true      # 2026-08-12 재개 — 두 번 대조로 환각을 막고 다시 켰다.
      window_s: 2.0      # 검증에 넘길 최근 오디오. 프리롤(0.5)과 **별도 버퍼**다 —
                         # 프리롤을 늘리면 호출 직전 TV·부모 말소리가 섞여 환각한다.
      # 이 힌트가 결정적이다(41% → 98%). 검증에만 쓰고 대화 STT 에는 절대 쓰지 않는다.
      initial_prompt: "재하봇아, 재하봇이, 재하봇 불러."
      max_ratio: 0.45    # ② 힌트 주고 들었을 때의 자모거리 컷.
      # ① 힌트 **없이** 들었을 때의 컷 — 환각을 죽이는 진짜 관문이다.
      # 실측(2026-08-12, 유튜브 3분 + 실음성 44건). 이 값만 흔든 표:
      #   컷    진짜호출  또박  보통  빠르게 흘려서   유튜브후보
      #   0.55    55%    57%   80%   60%   20%      0%
      #   0.65    75%    79%   80%   70%   70%      0%   ← 채택
      #   0.75    93%   100%   90%   90%   90%      7%
      #   1.01    98%   100%  100%   90%  100%     47%   (= 대조 안 함 = 예전 상태)
      # 0.75 는 진짜 호출을 더 살리지만 유튜브가 새기 시작한다. 0.65 가 경계다.
      plain_max_ratio: 0.65
      # 에너지 게이트 — **디지털 무음에 whisper 를 안 쓰기 위한 절약 장치**일 뿐이다.
      # 🔴 한때 기준을 max(소음바닥×2, 이 값) 으로 뒀다가 실기에서 진짜 호출을 막았다.
      #    유튜브를 틀면 소음 바닥이 0.005 -> 0.024 로 올라 기준이 0.0485 가 되는데,
      #    진짜 호출의 최대프레임 RMS 는 최소 0.0515 라 경계에 걸린다. 실제로 점수 0.103
      #    짜리 후보가 RMS 0.0344 로 잘려 나갔다(로그 2026-08-12 14:03:40).
      #    **시끄러울수록 귀를 닫는 설계였다** — 이제 바닥에 비례시키지 않는다.
      #    환각 방어는 게이트가 아니라 plain_max_ratio(두 번 대조)가 한다.
      min_rms: 0.005
      cooldown_s: 1.0    # 기각 후 최소 대기. 히스테리시스(점수가 임계 아래로 내려갔다
                         # 와야 재무장)와 함께 whisper 재호출 폭주를 막는다.
    # 연속 이만큼 임계를 넘어야 깨움(순간 잡음 차단용). 1프레임 = 80ms.
    # 2 로 두면 빠르게 말할 때 점수가 높은 구간이 짧아 연속 2회를 못 채우고 놓친다
    # (실기 관찰 2026-08-02: "천천히는 잘 되는데 빠르게 하면 안 됨"). → 1 로 완화.
    # ⏳ v4 는 빠른 발화를 제대로 학습했으므로 2 가 버틸 수 있다(헛깨움을 더 줄이는 카드).
    #    단 v4 실기가 통과한 '뒤에' 따로 바꿀 것 — 여기서 같이 바꾸면 원인을 못 가린다.
    trigger_frames: 1

  # 아래 2개는 detector: stt 폴백일 때만 쓰인다(ONNX 로드 실패 시 자동 폴백).
  threshold: 0.68      # 자모거리 컷. 실측(2026-07-27): 또박또박 0.25~0.57 / 무관어 0.71~1.0
  aliases: ["개하복", "제하모", "재하모사", "재보소"]  # 자주 나온 확정 오인식 → 즉시 깨움

  sleep_timeout: 30    # 대화 중 이만큼(초) 조용하면 다시 대기(잠듦)로
  # sleep_words: ["잘자", "바이바이"]   # 이 말 하면 즉시 대기로. 생략 시 wake.py 기본값 사용

metrics:
  # STEP 7 계측: 턴마다 단계별 지연·메모리를 logs/metrics_YYYYMMDD.jsonl 에 기록.
  # 젯슨 이식 '전' PC baseline 확보용(이식 후 같은 로깅으로 비교). 오버헤드 무시 수준.
  enabled: true
  tag: jetson      # 환경 표시. 이 파일이 젯슨 기준이라 기본값도 jetson 이다.
                   # 노트북은 configs/local.yaml 에서 pc 로 덮어쓴다.
                   # (2026-08-05 이전에는 기본이 pc 라 젯슨 실기 로그가 전부 pc 로 찍혔다.)

llm:
  # EXAONE-3.5-2.4B(한국어 특화, 반말 유리, 비상업 라이선스). llama-cpp 0.3.2 로드확인됨.
  model_path: models/exaone-3.5-2.4b-q4.gguf
  # ⛔ 옛 Qwen2.5-1.5B(models/llm-q4.gguf)는 2026-08-05 에 삭제했다(1.1GB).
  #    존댓말 문제로 교체한 뒤 한 번도 되돌린 적이 없다. 필요하면 HF 에서 다시 받을 것.
  fewshot_path: data/finetune_seed.jsonl  # few-shot 예시 소스(=QLoRA 데이터셋 씨앗과 동일 파일).
                                          # few_shot=true 항목만 매 요청 system 다음에 주입해 반말·2문장 말투 고정.
  n_ctx: 2048
  n_threads: 4
  # GPU 오프로드 레이어 수. -1=전체. Jetson(llama-cpp CUDA 소스빌드)에서 GPU 가속 켬.
  # PC(CPU 전용 빌드)에선 무시되어 무해(값 그대로 둬도 CPU로 돎). [[jaeha-bot-progress]]
  n_gpu_layers: -1
  max_tokens: 80                  # 두 문장 완결 보장(64는 긴답서 중간 잘려 미완결→TTS 뚝끊김). 길이는 프롬프트로 억제.
  seed: 777                       # 샘플링 시드 고정. 없으면 llama.cpp 가 매 실행 랜덤이라
                                  # 같은 질문에 답이 매번 다르고, 프롬프트 A/B 가 노이즈에 묻힌다
                                  # (2026-08-03: 같은 설정으로 평균 26.5~49.5자까지 흔들림을 확인).
                                  # TTS seed 와 같은 취지. null 이면 매번 랜덤.
  temperature: 0.3                # 작은 모델 헛소리↓(0.7->0.3 로 더 또렷하게)
  repeat_penalty: 1.1             # 1.3은 어미까지 억제+few-shot 문구 재사용 방해 → 1.1로 완화
  top_p: 0.9                      # 상위 누적확률 컷(또렷한 답)
  top_k: 40
  min_p: 0.05                     # 저확률 토큰 컷
  max_sentences: 2                # 완결문장 최대 개수(하드캡). 초과 시 사족 제거(agent._clamp_sentences)
                                  # ⚠️ 1 로 내리지 말 것 — A/B(2026-08-03) 결과 오히려 나빠진다.
                                  #    길이는 프롬프트('스무 글자 안팎')가 잡는다: 2문장 30.0자 vs 1문장 26.5자.
                                  #    3.5자(0.6초) 아끼는 대신 few-shot 이 가르친 뒷문장(놀이 제안)이 잘린다.
                                  #    실례: "토마토 끓이는 소리를 흉내내볼까?"(2문장 허용, 18자) 가
                                  #          "토마토 끓이는 건 재미있지만, 지금은 놀이로 접근해야겠어!"(1문장, 32자)보다 낫다.
                                  # ⚠️ max_tokens 도 80 유지 — 줄이면 첫 문장이 중간에 잘려 '뚝' 끊긴다
                                  #    (_clamp_sentences 는 종결부호가 있어야 자르므로 잘린 문장은 못 거른다).

  # ── 원격 백엔드(선택) ──────────────────────────────────────────────────────
  # backend: openai 로 바꾸면 gpt-4o-mini 가 답한다. .env 의 OPENAI_API_KEY 필요.
  # 실패하면 로컬 EXAONE 으로 자동 폴백한다(로그에 '폴백'이 찍힌다).
  # model_path 는 폴백용으로 계속 필요하니 지우지 말 것.
  #
  # 2026-08-10 젯슨 실측(안전 14문항 × 2회, 같은 프롬프트 2165자):
  #   로컬 EXAONE  중앙 1.769s / p95 3.138s   답변 40~50자가 흔함
  #   gpt-4o-mini  중앙 0.892s / p95 2.252s   답변 18~33자
  # ➡️ 0.88초 단축에 p95 까지 개선. 게다가 **길이 지시를 API 가 더 잘 따른다**
  #    (프롬프트 강화 뒤에도 남은 격차 — 2026-08-07 '지시 따르기' 항목).
  # 온도·top_p 등은 API 로는 보내지 않는다. tools/eval_llm.py 의 make_openai 와
  # 인자를 같게 맞춰야 평가에서 잰 품질·지연이 운영에서 그대로 재현된다.
  backend: local                  # local(llama.cpp·기본) | openai
  api_model: gpt-4o-mini
  # 실측 p95 2.25s / 최대 2.28s. 🔴 이 값 = 네트워크가 죽었을 때의 침묵 길이다
  # (타임아웃 뒤 로컬이 1.7초를 더 쓰므로 총 침묵 ≈ api_timeout + 1.7s).
  api_timeout: 3.0
  # ⚠️ 폴백은 기동 때 agent.warm() 으로 예열해 둔다(main.build_pipeline).
  #    예열이 없으면 첫 폴백이 7.18s, 로드만 예열해도 여전히 7.18s —
  #    비용은 로드가 아니라 첫 추론(prompt eval + CUDA 초기화)이었다. 예열 후 4.1s / 정상 1.7s.
