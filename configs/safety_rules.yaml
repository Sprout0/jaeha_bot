# 안전·윤리 규칙 (가이드 6).
# 🚧 현재는 config.py 가 읽어 settings.safety 로 들고만 있고 **소비하는 코드가 없다.**
#    지금 안전은 프롬프트(prompt_templates.yaml)로만 걸려 있다. 여기 규칙을 실제
#    필터/에스컬레이션으로 만들 때 이 파일을 입력으로 쓸 것.
blocklist_topics:
  - 폭력
  - 욕설
  - 약물
  - 신체 접촉 지시
  - 외출/이동 지시
  - 의료/심리 진단
escalate_to_guardian:
  - 울음/공포 감지
  - 위험 상황 단어
privacy:
  store_locally_only: true        # 이름/얼굴/발음/대화는 로컬에만
  briefing_share: summary_only    # 부모 브리핑은 요약만 전달
