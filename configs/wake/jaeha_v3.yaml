# 배포 중인 jaehabot_v3.onnx 를 만든 설정 (2026-08-09 학습, Colab).
# export zip 에서 그대로 꺼낸 원본이다.
#
# 🔴 아래 `tts_backend: voxcpm` 와 `voxcpm_tts.voice_design_prompts` 를 보고
#    "v3 는 voxcpm 으로 학습했다"고 읽으면 **틀린다.**
#    v3 의 긍정·부정 음성은 전부 **Supertonic** 으로 젯슨에서 만들었다
#    (tools/gen_wake_supertonic.py + tools/wake_qc.py, 19,092개).
#    generate 는 **배경음(backgrounds/rirs) 폴더를 얻으려고만** 돌렸고
#    (그래서 n_samples 가 2000 이 아니라 50 이다), 그 직후 노트북
#    tools/colab_wake_train_v3.ipynb 3번 셀에서 voxcpm 이 만든
#    positive_*/negative_* 를 통째로 지우고 우리 데이터로 갈아끼웠다.
#    → 실제로 학습에 영향을 준 키는 augmentation / model / steps / batch_* 뿐이다.
#    (length_scales·noise_scales 는 Piper 전용이라 어차피 무시된다.)
#
# 왜 갈아엎었나: voxcpm 이 만든 positive 가 '재하봇'을 말하지 않았다.
# 근거·실측은 메모리 jaeha-bot-progress 의 '호출어 v3' 섹션.
model_name: jaehabot_v3
target_phrases:
- 재하봇
- 재하봇아
- 재하봇이
tts_backend: voxcpm
n_samples: 50
n_samples_val: 10
n_background_samples: 3000
n_background_samples_val: 750
tts_batch_size: 256
custom_negative_phrases:
- 자동차
- 해바라기
- 지하철
- 재밌다
- 재미있어
- 재현이
- 로봇
- 보트
- 하마
- 자전거
- 엄마
- 아빠
- 이거 뭐야
- 밥 먹자
- 같이 놀자
- 안녕
- 싫어
noise_scales:
- 0.98
noise_scale_ws:
- 0.98
length_scales:
- 0.75
- 1.0
- 1.25
slerp_weights:
- 0.2
- 0.35
- 0.5
- 0.65
- 0.8
piper_tts:
  checkpoint_relpath: piper/en-us-libritts-high.pt
voxcpm_tts:
  model_id: openbmb/VoxCPM2
  model_cache_relpath: voxcpm/VoxCPM2
  local_model_path: null
  load_denoiser: false
  cfg_values:
  - 1.5
  - 2.0
  - 2.5
  - 3.0
  inference_timesteps_list:
  - 4
  - 6
  - 8
  voice_design_prompts:
  - 빠르게 부르는 한국인 어린 여자아이
  - 급하게 외치듯 부르는 한국인 남자아이
  - 신이 나서 빠르게 말하는 어린아이
  - 다급하게 부르는 어린아이
  - 빠른 말투로 또렷하게 말하는 한국인 성인 여성
  - 빠르게 툭 내뱉듯 부르는 어린아이
  - 숨차게 빠르게 부르는 한국인 아이
  - 보통 속도로 밝고 높게 말하는 한국인 어린 여자아이
  - 보통 속도로 해맑게 말하는 한국인 남자아이
  - 보통 속도로 또렷하게 말하는 한국인 성인 여성
  - 보통 속도로 차분하게 말하는 한국인 성인 남성
  - 보통 속도로 조금 웅얼거리며 말하는 어린아이
  - 신나서 크게 부르는 한국인 어린아이
  - 아주 천천히 또박또박 부르는 한국인 어린아이
  - 천천히 조심스럽게 부르는 한국인 여자아이
  - 느릿하게 웅얼거리는 어린아이
data_dir: /content/jaeha_wake/data
output_dir: /content/jaeha_wake/output
augmentation:
  clip_duration: 2.0
  batch_size: 64
  rounds: 3
  background_paths:
  - ./data/backgrounds
  rir_paths:
  - ./data/rirs
model:
  model_type: conv_attention
  model_size: medium
steps: 50000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1
batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
