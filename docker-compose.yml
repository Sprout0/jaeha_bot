# 재하봇 전면 API 경로를 컨테이너로 돌린다 (젯슨·리눅스 PC).
#
# 준비:
#   cp .env.example .env                              # OPENAI_API_KEY 채우기
#   cp configs/local.example.yaml configs/local.yaml  # '전면 API 로 바꾸기' 블록의 주석 풀기
#   models/wake/v6/ 에 호출어 모델 5개 + templates_haitid.npy (README '모델' 절)
# 실행:
#   docker compose up --build
#
# 노래 틀기(유튜브)는 크롬·Xvfb·PulseAudio 가 필요해 이 컨테이너에서는 켜지 않는다.
services:
  jaeha_bot:
    build: .
    image: jaeha_bot:realtime
    container_name: jaeha_bot
    env_file: .env
    devices:
      - /dev/snd:/dev/snd                              # ReSpeaker 마이크·스피커
    group_add:
      - audio
    volumes:
      - ./configs/local.yaml:/app/configs/local.yaml:ro
      - ./models:/app/models:ro
      - ./logs:/app/logs                               # 대화 로그·계측·보호자 기록
      - voice_cache:/root/.cache                       # 고정 문구 wav(첫 기동에 4~5분 합성)
    restart: unless-stopped

volumes:
  voice_cache:
