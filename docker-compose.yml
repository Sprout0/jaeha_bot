# Jetson Orin Nano 실행용. 카메라/오디오 장치와 모델 볼륨을 연결한다.
# 실행:  docker compose up --build
services:
  jaeha_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: jaeha_bot:jetson
    container_name: jaeha_bot
    runtime: nvidia            # nvidia-container-runtime (JetPack 기본 포함)
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/snd:/dev/snd      # 마이크/스피커
      - /dev/video0:/dev/video0  # USB/CSI 카메라
    volumes:
      - ./models:/app/models   # 모델 가중치 (이미지와 분리)
      - ./logs:/app/logs       # 로그/지연·메모리 측정
      - ./reports:/app/reports
    network_mode: host         # 로컬 우선, 외부 서버 의존 최소화
    restart: unless-stopped    # 독립 자동 부팅 (가이드 5)
