<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <!-- 발명신고용 도 2 (전면 API 판). 턴 판단과 응답 관문. 흑백, 수치 없음. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#fff"/>
  <text x="30" y="42" font-size="24" font-weight="700">【도 2】</text>

  <g stroke="#000" stroke-width="2" fill="#fff">
    <rect x="360" y="56" width="280" height="52" rx="26"/>
    <polygon points="500,136 650,186 500,236 350,186"/>
    <rect x="700" y="152" width="270" height="68"/>
    <rect x="330" y="268" width="340" height="60"/>
    <polygon points="500,358 650,408 500,458 350,408" fill="#e6e6e6" stroke-width="2.5"/>
    <!-- 위험 신호 있음 -->
    <rect x="40" y="490" width="360" height="64"/>
    <polygon points="220,582 330,622 220,662 110,622"/>
    <rect x="30" y="690" width="170" height="54"/>
    <rect x="240" y="690" width="210" height="54"/>
    <!-- 위험 신호 없음 -->
    <rect x="600" y="490" width="360" height="64"/>
    <polygon points="780,582 900,622 780,662 660,622"/>
    <rect x="560" y="690" width="170" height="54"/>
    <rect x="760" y="690" width="220" height="54"/>
  </g>

  <g text-anchor="middle">
    <text x="500" y="89" font-size="19" font-weight="700">받아 적은 글자</text>
    <text x="500" y="182" font-size="17" font-weight="700">명령인가?</text>
    <text x="500" y="204" font-size="13" fill="#333">잠들기 · 노래 · 놀이</text>
    <text x="835" y="182" font-size="17" font-weight="700">코드가 처리</text>
    <text x="835" y="205" font-size="13" fill="#333">놀이 턴은 도 3</text>
    <text x="500" y="295" font-size="17" font-weight="700">응답 요청 (명령 도구 포함)</text>
    <text x="500" y="316" font-size="13" fill="#333">모델이 도구를 부르면 명령으로 처리</text>
    <text x="500" y="405" font-size="17" font-weight="700">아이 말에</text>
    <text x="500" y="427" font-size="17" font-weight="700">위험 신호?</text>

    <text x="220" y="518" font-size="17" font-weight="700">소리를 모아 둔다 (한도 있음)</text>
    <text x="220" y="541" font-size="13" fill="#333">글자를 끝까지 받아 검사</text>
    <text x="220" y="628" font-size="16" font-weight="700">통과?</text>
    <text x="115" y="715" font-size="16" font-weight="700">모은 소리</text>
    <text x="115" y="735" font-size="16" font-weight="700">내보냄</text>
    <text x="345" y="715" font-size="16" font-weight="700">버리고 안전 문장</text>
    <text x="345" y="735" font-size="13" fill="#333">보호자 기록</text>

    <text x="780" y="518" font-size="17" font-weight="700">흘려보내며 글자 검사</text>
    <text x="780" y="541" font-size="13" fill="#333">지연 없음</text>
    <text x="780" y="618" font-size="15" font-weight="700">위험 제안</text>
    <text x="780" y="637" font-size="15" font-weight="700">발견?</text>
    <text x="645" y="715" font-size="16" font-weight="700">그대로</text>
    <text x="645" y="735" font-size="16" font-weight="700">재생</text>
    <text x="870" y="715" font-size="15" font-weight="700">취소 · 대기열 비움</text>
    <text x="870" y="735" font-size="13" fill="#333">안전 문장 · 보호자 기록</text>
  </g>

  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="500" y1="108" x2="500" y2="133"/>
    <line x1="650" y1="186" x2="697" y2="186"/>
    <line x1="500" y1="236" x2="500" y2="265"/>
    <line x1="500" y1="328" x2="500" y2="355"/>
    <polyline points="350,408 220,408 220,487"/>
    <polyline points="650,408 780,408 780,487"/>
    <line x1="220" y1="554" x2="220" y2="579"/>
    <line x1="110" y1="622" x2="110" y2="687"/>
    <line x1="330" y1="622" x2="330" y2="687"/>
    <line x1="780" y1="554" x2="780" y2="579"/>
    <line x1="660" y1="622" x2="660" y2="687"/>
    <line x1="900" y1="622" x2="900" y2="687"/>
  </g>
  <g font-size="14" fill="#333">
    <text x="660" y="178">예</text>
    <text x="510" y="256">아니오</text>
    <text x="270" y="400">있음</text>
    <text x="700" y="400">없음</text>
    <text x="90" y="660">예</text>
    <text x="338" y="660">아니오</text>
    <text x="652" y="660" text-anchor="end">아니오</text>
    <text x="908" y="660">예</text>
  </g>
</svg>
