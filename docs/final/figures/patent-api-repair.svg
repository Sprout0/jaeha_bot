<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <!-- 발명신고용 도 3 (전면 API 판). 놀이 대본 이탈 바로잡기의 시간 축. 흑백, 수치 없음. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>
  <text x="30" y="42" font-size="24" font-weight="700">【도 3】</text>

  <!-- 시간 축 -->
  <line x1="170" y1="490" x2="970" y2="490" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="965" y="518" font-size="16" text-anchor="end">시간</text>
  <text x="200" y="518" font-size="15" text-anchor="middle" fill="#333">응답 요청</text>
  <line x1="200" y1="484" x2="200" y2="496" stroke="#000" stroke-width="2"/>

  <!-- 행 이름 -->
  <g font-size="18" font-weight="700">
    <text x="30" y="118">응답 글자</text>
    <text x="30" y="238">응답 소리</text>
    <text x="30" y="258" font-size="14" font-weight="400" fill="#333">(재생 대기열)</text>
    <text x="30" y="378">실제 재생</text>
  </g>

  <!-- 글자: 빨리 다 온다 -->
  <g stroke="#000" stroke-width="2">
    <rect x="220" y="92" width="120" height="40" fill="#fff"/>
    <rect x="340" y="92" width="70"  height="40" fill="#e6e6e6" stroke-width="3"/>
    <rect x="410" y="92" width="100" height="40" fill="#fff"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="280" y="118">잘했어! 그럼</text>
    <text x="375" y="118" font-weight="700">사자</text>
    <text x="460" y="118">는 어흥?</text>
  </g>
  <text x="375" y="80" font-size="14" text-anchor="middle" fill="#333">허용되지 않은 이름 발견</text>

  <!-- 소리: 늦게, 길게 -->
  <g stroke="#000" stroke-width="2">
    <rect x="300" y="212" width="250" height="40" fill="#fff"/>
    <rect x="550" y="212" width="150" height="40" fill="url(#h)"/>
    <rect x="700" y="212" width="200" height="40" fill="url(#h)"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="425" y="238">잘했어! 그럼</text>
    <text x="625" y="205" fill="#333">사자 (버림)</text>
    <text x="800" y="205" fill="#333">는 어흥? (버림)</text>
  </g>

  <!-- 글자 위치 → 소리 위치 -->
  <g stroke="#000" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)">
    <line x1="340" y1="132" x2="548" y2="210"/>
  </g>
  <text x="560" y="160" font-size="14" fill="#333">글자 위치 → 소리 위치</text>

  <!-- 자르는 곳: 조용한 틈 -->
  <line x1="545" y1="190" x2="545" y2="440" stroke="#000" stroke-width="3"/>
  <text x="545" y="460" font-size="15" text-anchor="middle" font-weight="700">조용한 틈에서 자름</text>

  <!-- 실제 재생 -->
  <g stroke="#000" stroke-width="2">
    <rect x="300" y="352" width="245" height="40" fill="#fff"/>
    <rect x="545" y="352" width="300" height="40" fill="#e6e6e6" stroke-width="3"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="422" y="378">잘했어! 그럼</text>
    <text x="695" y="378" font-weight="700">고양이는 어떻게 울어? (미리 합성)</text>
  </g>

  <!-- 선행 시간 -->
  <g stroke="#000" stroke-width="1.5" fill="none">
    <line x1="340" y1="300" x2="545" y2="300" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="340" y1="140" x2="340" y2="310" stroke-dasharray="3 3"/>
  </g>
  <text x="442" y="292" font-size="14" text-anchor="middle" fill="#333">글자가 먼저 온 시간</text>
</svg>
