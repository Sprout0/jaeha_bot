<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <!-- 발명신고용 도 1 (전면 API 판). 흑백, 수치 없음. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>
  <text x="30" y="42" font-size="24" font-weight="700">【도 1】</text>

  <!-- 로봇 경계 -->
  <rect x="20" y="62" width="720" height="470" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="36" y="88" font-size="17">로봇 (단일 보드)</text>

  <g stroke="#000" stroke-width="2" fill="#fff">
    <rect x="40"  y="120" width="120" height="80"/>
    <rect x="195" y="120" width="160" height="80"/>
    <rect x="390" y="120" width="160" height="80"/>
    <rect x="585" y="120" width="145" height="80"/>
    <rect x="40"  y="300" width="120" height="90"/>
    <rect x="195" y="300" width="160" height="90"/>
    <rect x="390" y="300" width="160" height="90" fill="#e6e6e6" stroke-width="3"/>
    <rect x="585" y="300" width="145" height="90"/>
    <rect x="390" y="450" width="160" height="66"/>
    <!-- 원격 -->
    <rect x="790" y="110" width="190" height="400"/>
  </g>

  <g font-size="20" font-weight="700" text-anchor="middle">
    <text x="100" y="167">마이크</text>
    <text x="275" y="155">① 호출어</text><text x="275" y="181">검출부</text>
    <text x="470" y="155">② 발화</text><text x="470" y="181">전송부</text>
    <text x="657" y="155">③ 턴</text><text x="657" y="181">판단부</text>
    <text x="100" y="352">스피커</text>
    <text x="275" y="337">⑥ 재생부</text>
    <text x="470" y="337">⑤ 응답</text><text x="470" y="362">관문</text>
    <text x="657" y="337">④ 놀이</text><text x="657" y="362">상태머신</text>
    <text x="470" y="480">⑧ 보호자</text><text x="470" y="505">기록부</text>
    <text x="885" y="250">⑦ 원격</text>
    <text x="885" y="278">음성-음성</text>
    <text x="885" y="306">언어모델</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333">
    <text x="275" y="218">2단계 검증</text>
    <text x="275" y="362">재생량 계수</text>
    <text x="275" y="380">대기열 자르기</text>
    <text x="470" y="382" font-size="13">붙잡기·검사·자르기</text>
    <text x="657" y="382" font-size="13">허용 이름·대체 문장</text>
    <text x="885" y="340">받아 적기</text>
    <text x="885" y="360">응답 글자 + 소리</text>
    <text x="885" y="380">명령 도구</text>
  </g>

  <!-- 보드 안 흐름 -->
  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="160" y1="160" x2="192" y2="160"/>
    <line x1="355" y1="160" x2="387" y2="160"/>
    <line x1="657" y1="200" x2="657" y2="297"/>
    <line x1="585" y1="345" x2="553" y2="345"/>
    <line x1="390" y1="345" x2="358" y2="345"/>
    <line x1="195" y1="345" x2="163" y2="345"/>
    <line x1="470" y1="390" x2="470" y2="447"/>
  </g>
  <g font-size="13" fill="#333">
    <text x="665" y="245">놀이 턴</text>
  </g>

  <!-- 원격과 오가는 것 (점선) -->
  <g stroke="#000" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)">
    <polyline points="470,120 470,98 870,98 870,107"/>
    <line x1="787" y1="145" x2="733" y2="145"/>
    <line x1="733" y1="180" x2="787" y2="180"/>
    <polyline points="787,420 570,420 570,393"/>
  </g>
  <g font-size="14" fill="#333">
    <text x="560" y="92">호출어 뒤 소리만</text>
    <text x="763" y="138" text-anchor="middle" font-size="12">글자</text>
    <text x="763" y="198" text-anchor="middle" font-size="12">요청</text>
    <text x="680" y="438" text-anchor="middle">응답 글자·소리</text>
  </g>
</svg>
