<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <!-- 발명신고용 도 1. 보고서용 그림 1(pipeline-block.svg)에서 수치와 주석을 빼고 흑백으로 다시 그렸다 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#fff"/>
  <text x="30" y="42" font-size="24" font-weight="700">【도 1】</text>

  <!-- 로봇(단일 보드) 경계 -->
  <rect x="20" y="70" width="960" height="370" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="36" y="98" font-size="18">음성 대화 로봇 (단일 보드 — 음성은 이 안에서만 처리)</text>

  <g font-size="22" font-weight="700" text-anchor="middle" stroke="#000" stroke-width="2">
    <!-- 1행: 듣기 -->
    <rect x="40"  y="130" width="190" height="90" fill="#fff"/>
    <rect x="285" y="130" width="190" height="90" fill="#fff"/>
    <rect x="530" y="130" width="190" height="90" fill="#fff"/>
    <rect x="775" y="130" width="190" height="90" fill="#fff"/>
    <!-- 2행: 말하기 -->
    <rect x="40"  y="310" width="190" height="90" fill="#fff"/>
    <rect x="285" y="310" width="190" height="90" fill="#fff"/>
    <rect x="530" y="310" width="190" height="90" fill="#fff"/>
    <rect x="775" y="310" width="190" height="90" fill="#e6e6e6" stroke-width="3"/>
  </g>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="135" y="183">마이크</text>
    <text x="380" y="170">① 호출어</text><text x="380" y="200">검출부</text>
    <text x="625" y="170">② 발화</text><text x="625" y="200">수집부</text>
    <text x="870" y="170">③ 음성</text><text x="870" y="200">인식부</text>
    <text x="135" y="363">스피커</text>
    <text x="380" y="350">⑥ 음성</text><text x="380" y="380">합성부</text>
    <text x="625" y="350">⑤ 안전</text><text x="625" y="380">처리부</text>
    <text x="870" y="343">④ 대화</text><text x="870" y="371">처리부</text>
  </g>
  <g font-size="16" text-anchor="middle" fill="#333">
    <text x="380" y="245">오검출 억제 2단계 검증</text>
    <text x="870" y="392" font-size="15">놀이 / 자유대화 (도 2)</text>
  </g>

  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="230" y1="175" x2="282" y2="175"/>
    <line x1="475" y1="175" x2="527" y2="175"/>
    <line x1="720" y1="175" x2="772" y2="175"/>
    <line x1="870" y1="220" x2="870" y2="307"/>
    <line x1="775" y1="355" x2="723" y2="355"/>
    <line x1="530" y1="355" x2="478" y2="355"/>
    <line x1="285" y1="355" x2="233" y2="355"/>
  </g>

  <!-- 경계 밖: 원격 언어모델. 문자만 오간다 -->
  <rect x="690" y="490" width="270" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="825" y="524" font-size="20" font-weight="700" text-anchor="middle">원격 언어모델</text>
  <text x="825" y="553" font-size="16" text-anchor="middle" fill="#333">연결이 끊기면 로컬 모델로 대체</text>
  <g stroke="#000" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="850" y1="403" x2="850" y2="487" marker-end="url(#a)"/>
    <line x1="890" y1="487" x2="890" y2="403" marker-end="url(#a)"/>
  </g>
  <text x="836" y="470" font-size="16" fill="#333" text-anchor="end">문자만 전송</text>
</svg>
