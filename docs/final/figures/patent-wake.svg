<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <!-- 발명신고용 도 2. 보고서용 wake-two-stage.svg 에서 수치 주석과 대조 구성을 빼고 흑백으로 다시 그렸다.
       시간축은 개념도이며 축척이 아니다. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#fff"/>
  <text x="30" y="42" font-size="24" font-weight="700">【도 2】</text>

  <!-- 점수 곡선 -->
  <line x1="80" y1="250" x2="960" y2="250" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="955" y="278" font-size="17" text-anchor="end">시간</text>
  <line x1="80" y1="200" x2="940" y2="200" stroke="#000" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="940" y="192" font-size="16" text-anchor="end" fill="#333">임계값</text>
  <path d="M80,246 C170,246 200,240 230,215 C255,190 280,120 330,95 C380,120 400,190 430,230 C455,246 520,247 600,247"
        fill="none" stroke="#000" stroke-width="3"/>
  <text x="440" y="140" font-size="18" font-weight="700">제1 검출기 점수 (110)</text>

  <line x1="236" y1="80" x2="236" y2="300" stroke="#000" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="228" y="75" font-size="17" text-anchor="end">후보 판정 (120)</text>
  <line x1="330" y1="95" x2="330" y2="250" stroke="#000" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="340" y="75" font-size="17">최고점 (130)</text>

  <!-- 대기 시간 -->
  <line x1="238" y1="300" x2="378" y2="300" stroke="#000" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="308" y="290" font-size="17" text-anchor="middle">대기 (140)</text>
  <line x1="380" y1="240" x2="380" y2="345" stroke="#000" stroke-width="1.5"/>

  <!-- 검증 구간 -->
  <rect x="380" y="320" width="520" height="56" fill="#e6e6e6" stroke="#000" stroke-width="2.5"/>
  <text x="640" y="355" font-size="21" font-weight="700" text-anchor="middle">검증 구간 (150)</text>

  <!-- 임베딩 열 -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <rect x="392" y="405" width="24" height="24"/><rect x="424" y="405" width="24" height="24"/>
    <rect x="456" y="405" width="24" height="24"/><rect x="488" y="405" width="24" height="24"/>
    <rect x="520" y="405" width="24" height="24"/><rect x="552" y="405" width="24" height="24"/>
    <rect x="584" y="405" width="24" height="24"/>
  </g>
  <text x="624" y="424" font-size="20">⋯</text>
  <text x="660" y="424" font-size="18">임베딩 열 (160)</text>
  <line x1="640" y1="378" x2="640" y2="400" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="652" y="394" font-size="15" fill="#333">제1 검출기의 임베딩 추출기 재사용</text>

  <!-- 대조와 확정 -->
  <rect x="80" y="480" width="230" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="195" y="518" font-size="19" font-weight="700" text-anchor="middle">본보기 임베딩 (170)</text>
  <rect x="400" y="480" width="200" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="500" y="518" font-size="19" font-weight="700" text-anchor="middle">유사도 판정</text>
  <rect x="740" y="480" width="200" height="64" fill="#e6e6e6" stroke="#000" stroke-width="2.5"/>
  <text x="840" y="518" font-size="19" font-weight="700" text-anchor="middle">호출 확정 (180)</text>
  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="310" y1="512" x2="397" y2="512"/>
    <line x1="500" y1="432" x2="500" y2="477"/>
    <line x1="600" y1="512" x2="737" y2="512"/>
  </g>
  <rect x="740" y="566" width="200" height="44" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="840" y="594" font-size="16" text-anchor="middle">전사 판정 (190)</text>
  <line x1="740" y1="588" x2="680" y2="588" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="680" y1="588" x2="680" y2="520" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="652" y="560" font-size="15" fill="#333">OR</text>
</svg>
