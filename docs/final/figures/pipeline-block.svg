<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="700" fill="#0f172a">그림 1. 재하봇 파이프라인과 구간별 실측 지연</text>
  <text x="24" y="56" font-size="12.5" fill="#475569">Jetson Orin Nano 8GB + ReSpeaker · 기준 시점 doc-baseline-2026-09 · 지연은 2026-09-07 젯슨 실기 5턴</text>

  <!-- ── 입력 경로 (왼 → 오) ────────────────────────────── -->
  <text x="24" y="92" font-size="12" font-weight="700" fill="#1d4ed8">듣기</text>

  <g fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4">
    <rect x="40"  y="102" width="185" height="70" rx="7"/>
    <rect x="265" y="102" width="185" height="70" rx="7"/>
    <rect x="490" y="102" width="185" height="70" rx="7"/>
    <rect x="715" y="102" width="185" height="70" rx="7"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="132.5" y="128" font-weight="700">마이크 입력</text>
    <text x="357.5" y="128" font-weight="700">① 호출어 검출</text>
    <text x="582.5" y="128" font-weight="700">② 발화 수집</text>
    <text x="807.5" y="128" font-weight="700">③ 음성 인식</text>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="132.5" y="146">ReSpeaker · 16 kHz</text>
    <text x="132.5" y="162">소음바닥 0.00698</text>
    <text x="357.5" y="146">ONNX 2단계 (1단계 + 검증)</text>
    <text x="357.5" y="162">깨움 1.3 s · 검증 0.85 s</text>
    <text x="582.5" y="146">VAD · 무음 꼬리 1.2 s</text>
    <text x="582.5" y="162">끝을 아는 유일한 방법</text>
    <text x="807.5" y="146">faster-whisper medium</text>
    <text x="807.5" y="162">로컬 CUDA · 3~6세 CER 31.5%</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <path d="M225,137 L262,137"/>
    <path d="M450,137 L487,137"/>
    <path d="M675,137 L712,137"/>
  </g>

  <!-- 오른쪽에서 아래로 꺾어 말하기 줄로 -->
  <path d="M900,137 L940,137 L940,250 L903,250" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ── 말하기 경로 (오 → 왼) ──────────────────────────── -->
  <text x="24" y="207" font-size="12" font-weight="700" fill="#b45309">말하기</text>

  <g fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4">
    <rect x="715" y="215" width="185" height="70" rx="7"/>
    <rect x="490" y="215" width="185" height="70" rx="7"/>
    <rect x="265" y="215" width="185" height="70" rx="7"/>
    <rect x="40"  y="215" width="185" height="70" rx="7"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="807.5" y="241" font-weight="700">④ 응답 생성</text>
    <text x="582.5" y="241" font-weight="700">⑤ 안전 검사</text>
    <text x="357.5" y="241" font-weight="700">⑥ 음성 합성</text>
    <text x="132.5" y="241" font-weight="700">스피커 출력</text>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="807.5" y="259">gpt API (원격)</text>
    <text x="807.5" y="275">+ 로컬 GGUF 폴백 2.3 GB</text>
    <text x="582.5" y="259">낱말 규칙 기반 필터</text>
    <text x="582.5" y="275">function calling 아님</text>
    <text x="357.5" y="259">Supertonic · TensorRT @24</text>
    <text x="357.5" y="275">합성 817.0 → 453.8 ms</text>
    <text x="132.5" y="259">첫 소리 1,090 → 721 ms</text>
    <text x="132.5" y="275">PLAY_PAD_S 0.15 (미계측)</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <path d="M715,250 L678,250"/>
    <path d="M490,250 L453,250"/>
    <path d="M265,250 L228,250"/>
  </g>

  <!-- 되먹임 차단 -->
  <path d="M132.5,285 L132.5,320 L60,320 L60,178" stroke="#94a3b8" stroke-width="1.3"
        stroke-dasharray="4 3" fill="none" marker-end="url(#ard)"/>
  <text x="150" y="324" font-size="10.5" fill="#64748b">자기 목소리 되먹임 차단 — AudioSource.drain()</text>

  <!-- 보조 계층 -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2">
    <rect x="490" y="345" width="185" height="52" rx="7"/>
    <rect x="715" y="345" width="185" height="52" rx="7"/>
  </g>
  <g font-size="11.5" fill="#0f172a" text-anchor="middle">
    <text x="582.5" y="366" font-weight="700">필러(맞장구)</text>
    <text x="807.5" y="366" font-weight="700">놀이 / 자유대화 분기</text>
  </g>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="582.5" y="384">LLM 호출 전 · 자유대화 턴에만</text>
    <text x="807.5" y="384">놀이는 카드 정답 낱말로 판정</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ard)">
    <path d="M582.5,345 L582.5,318 L770,318 L770,288"/>
    <path d="M845,345 L845,288"/>
  </g>

  <!-- ── 체감 지연 타임라인 ───────────────────────────── -->
  <line x1="24" y1="430" x2="976" y2="430" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="458" font-size="14" font-weight="700" fill="#0f172a">체감 응답 지연의 내역 — 구간별 중앙값</text>
  <text x="24" y="477" font-size="11" fill="#475569">
    체감 중앙 4.14 s · p90 5.07 s · 상한 3.0 s 이내 0% (5턴). 재생 2.85 s 는 체감에 안 들어간다 — 첫 소리까지가 체감이다.
  </text>

  <g>
    <rect x="120" y="492" width="201.6" height="34" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="321.6" y="492" width="109.8" height="34" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="431.4" y="492" width="282.6" height="34" fill="#fde68a" stroke="#f59e0b" stroke-width="1.1"/>
    <rect x="714" y="492" width="136.8" height="34" fill="#fed7aa" stroke="#f59e0b" stroke-width="1.1"/>
  </g>
  <g font-size="11.5" fill="#0f172a" text-anchor="middle">
    <text x="220.8" y="514" font-weight="700">② 꼬리 1.12 s</text>
    <text x="376.5" y="514" font-weight="700">③ 0.61 s</text>
    <text x="572.7" y="514" font-weight="700">④ 생각 1.57 s</text>
    <text x="782.4" y="514" font-weight="700">⑥ TTS 0.76 s</text>
  </g>
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <text x="220.8" y="542">정의상 무음</text>
    <text x="376.5" y="542">인식</text>
    <text x="572.7" y="542">왕복 89% / 생성 12% / 프롬프트 1%</text>
    <text x="782.4" y="542">첫 소리까지</text>
  </g>
  <text x="112" y="514" font-size="11" fill="#475569" text-anchor="end">아이 말 끝</text>
  <text x="858" y="514" font-size="11" fill="#475569">첫 소리</text>

  <text x="24" y="576" font-size="10.5" fill="#b91c1c">
    ⚠️ 구간별 중앙값의 합(4.06 s)은 체감 중앙값(4.14 s)과 정확히 같지 않다 — 턴마다 어느 구간이 긴지가 달라서다. 합으로 체감을 예측하면 틀린다.
  </text>
  <text x="24" y="596" font-size="10.5" fill="#475569">
    ⚠️ 꼬리 1.2 s 를 판정 모델로 줄이려 한 시도는 기각됐다 — Smart Turn v3.2 재현율이 벤더 성인 97.8% 대 우리 3~6세 37.3% (reports/turn/README.md).
  </text>
  <text x="24" y="616" font-size="10.5" fill="#475569">
    출처: reports/jetson/metrics_20260907.jsonl · reports/stt/README.md · reports/bench/README.md · reports/turn/README.md
  </text>
</svg>
