<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 그림 제목은 문서의 캡션이 단다 — 이 안에 또 적으면 같은 제목이 두 번 나온다. -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="24" y="28" font-size="13" fill="#475569">Jetson Orin Nano 8GB + ReSpeaker · 기준 시점 doc-baseline-2026-09-12 · 지연은 2026-09-07 젯슨 실기 5턴</text>

  <!-- ── 입력 경로 (왼 → 오) ────────────────────────────── -->
  <text x="24" y="62" font-size="13" font-weight="700" fill="#1d4ed8">듣기</text>

  <g fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4">
    <rect x="40"  y="72" width="185" height="78" rx="7"/>
    <rect x="265" y="72" width="185" height="78" rx="7"/>
    <rect x="490" y="72" width="185" height="78" rx="7"/>
    <rect x="715" y="72" width="185" height="78" rx="7"/>
  </g>
  <g font-size="14.5" fill="#0f172a" text-anchor="middle">
    <text x="132.5" y="100" font-weight="700">마이크 입력</text>
    <text x="357.5" y="100" font-weight="700">① 호출어 검출</text>
    <text x="582.5" y="100" font-weight="700">② 발화 수집</text>
    <text x="807.5" y="100" font-weight="700">③ 음성 인식</text>
  </g>
  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <text x="132.5" y="122">ReSpeaker · 16 kHz</text>
    <text x="132.5" y="140">소음바닥 0.00698</text>
    <text x="357.5" y="122">ONNX 1단계 + 2단계 검증</text>
    <text x="357.5" y="140">깨움 1.3 s · 검증 0.85 s</text>
    <text x="582.5" y="122">음성 활동 검출</text>
    <text x="582.5" y="140">무음 꼬리 1.2 s</text>
    <text x="807.5" y="122">faster-whisper medium</text>
    <text x="807.5" y="140">로컬 CUDA · 3~6세 CER 31.5%</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <path d="M225,111 L262,111"/>
    <path d="M450,111 L487,111"/>
    <path d="M675,111 L712,111"/>
  </g>

  <!-- 오른쪽에서 아래로 꺾어 말하기 줄로 -->
  <path d="M900,111 L945,111 L945,234 L903,234" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ── 말하기 경로 (오 → 왼) ──────────────────────────── -->
  <text x="24" y="185" font-size="13" font-weight="700" fill="#b45309">말하기</text>

  <g fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4">
    <rect x="715" y="195" width="185" height="78" rx="7"/>
    <rect x="490" y="195" width="185" height="78" rx="7"/>
    <rect x="265" y="195" width="185" height="78" rx="7"/>
    <rect x="40"  y="195" width="185" height="78" rx="7"/>
  </g>
  <g font-size="14.5" fill="#0f172a" text-anchor="middle">
    <text x="807.5" y="223" font-weight="700">④ 응답 생성</text>
    <text x="582.5" y="223" font-weight="700">⑤ 안전 처리</text>
    <text x="357.5" y="223" font-weight="700">⑥ 음성 합성</text>
    <text x="132.5" y="223" font-weight="700">스피커 출력</text>
  </g>
  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <text x="807.5" y="245">gpt API (원격)</text>
    <text x="807.5" y="263">+ 로컬 GGUF 폴백 2.3 GB</text>
    <text x="582.5" y="245">이모지·기호 제거</text>
    <text x="582.5" y="263">재생 요청은 낱말 규칙</text>
    <text x="357.5" y="245">Supertonic · TensorRT @24</text>
    <text x="357.5" y="263">합성 817 → 454 ms</text>
    <text x="132.5" y="245">첫 소리 1,090 → 721 ms</text>
    <text x="132.5" y="263">스피커 미확보 · 이어폰 검증</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <path d="M715,234 L678,234"/>
    <path d="M490,234 L453,234"/>
    <path d="M265,234 L228,234"/>
  </g>

  <!-- 되먹임 차단 -->
  <path d="M132.5,273 L132.5,304 L60,304 L60,156" stroke="#94a3b8" stroke-width="1.3"
        stroke-dasharray="4 3" fill="none" marker-end="url(#ard)"/>
  <text x="150" y="308" font-size="12" fill="#64748b">로봇이 말하는 동안 들어온 소리는 버린다 — 자기 목소리 되먹임 차단</text>

  <!-- 보조 계층 -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2">
    <rect x="490" y="332" width="185" height="58" rx="7"/>
    <rect x="715" y="332" width="185" height="58" rx="7"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="582.5" y="354" font-weight="700">맞장구</text>
    <text x="807.5" y="354" font-weight="700">놀이 / 자유대화 분기</text>
  </g>
  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="582.5" y="374">자유대화 턴 · 언어모델 호출 전</text>
    <text x="807.5" y="374">놀이는 카드 정답 낱말로 판정</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ard)">
    <path d="M582.5,332 L582.5,318 L770,318 L770,276"/>
    <path d="M845,332 L845,276"/>
  </g>

  <!-- ── 체감 지연 타임라인 ───────────────────────────── -->
  <line x1="24" y1="415" x2="976" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="443" font-size="15" font-weight="700" fill="#0f172a">체감 응답 지연의 내역 — 구간별 중앙값</text>
  <text x="24" y="464" font-size="12.5" fill="#475569">체감 중앙 4.14 s · 90분위 5.07 s · 목표 3.0 s 이내 0% (5턴). 재생 2.85 s 는 체감에 넣지 않는다 — 첫 소리까지가 체감이다.</text>

  <g>
    <rect x="120" y="480" width="201.6" height="36" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="321.6" y="480" width="109.8" height="36" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.1"/>
    <rect x="431.4" y="480" width="282.6" height="36" fill="#fde68a" stroke="#f59e0b" stroke-width="1.1"/>
    <rect x="714" y="480" width="136.8" height="36" fill="#fed7aa" stroke="#f59e0b" stroke-width="1.1"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="220.8" y="503" font-weight="700">② 꼬리 1.12 s</text>
    <text x="376.5" y="503" font-weight="700">③ 0.61 s</text>
    <text x="572.7" y="503" font-weight="700">④ 생각 1.57 s</text>
    <text x="782.4" y="503" font-weight="700">⑥ TTS 0.76 s</text>
  </g>
  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="220.8" y="532">무음 대기</text>
    <text x="376.5" y="532">인식</text>
    <text x="572.7" y="532">왕복 89% · 생성 12% · 프롬프트 1%</text>
    <text x="782.4" y="532">첫 소리까지</text>
  </g>
  <text x="112" y="503" font-size="12" fill="#475569" text-anchor="end">아이 말 끝</text>
  <text x="860" y="503" font-size="12" fill="#475569">첫 소리</text>

  <text x="24" y="562" font-size="12" fill="#475569">주 1) 구간별 중앙값의 합(4.06 s)은 체감 중앙값(4.14 s)과 일치하지 않는다. 턴마다 긴 구간이 달라서이며, 합으로 체감을 예측하면 틀린다.</text>
  <text x="24" y="582" font-size="12" fill="#475569">주 2) 꼬리 1.2 s 를 판정 모델로 줄이려는 시도는 기각하였다 — 재현율이 성인 97.8%(제공사 공개 데이터) 대 3~6세 37.3%였다.</text>
  <text x="24" y="602" font-size="12" fill="#475569">주 3) 측정 원본과 장별 근거 파일은 별첨 1의 부록 B에 정리하였다.</text>
</svg>
