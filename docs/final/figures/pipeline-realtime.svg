<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 그림 제목은 문서의 캡션이 단다 — 이 안에 또 적으면 같은 제목이 두 번 나온다. -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="24" y="28" font-size="13" fill="#475569">Jetson Orin Nano 8GB + ReSpeaker · 진입점 app/main_realtime.py · 지연은 2026-09-19 젯슨 실기 18턴</text>

  <!-- ── 보드 안 ─────────────────────────────────────── -->
  <rect x="16" y="44" width="968" height="138" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="28" y="64" font-size="13" font-weight="700" fill="#1d4ed8">보드 안 (Jetson)</text>

  <g fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4">
    <rect x="30"  y="76" width="170" height="92" rx="7"/>
    <rect x="215" y="76" width="170" height="92" rx="7"/>
    <rect x="400" y="76" width="170" height="92" rx="7"/>
  </g>
  <g fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4">
    <rect x="585" y="76" width="170" height="92" rx="7"/>
    <rect x="770" y="76" width="200" height="92" rx="7"/>
  </g>
  <g font-size="14.5" fill="#0f172a" text-anchor="middle" font-weight="700">
    <text x="115" y="102">마이크 입력</text>
    <text x="300" y="102">① 호출어 검출</text>
    <text x="485" y="102">전송 게이트</text>
    <text x="670" y="102">④ 턴 판단</text>
    <text x="870" y="102">⑤ 안전 가드 · 출력</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="115" y="124">ReSpeaker · 16 kHz</text>
    <text x="115" y="142">깨어 있을 때만 연결</text>
    <text x="300" y="124">ONNX 1단계</text>
    <text x="300" y="142">+ 임베딩 대조(로컬)</text>
    <text x="485" y="124">반이중 — 말하는 동안 차단</text>
    <text x="485" y="142">16 → 24 kHz</text>
    <text x="670" y="124">잠들기 · 노래 · 놀이 · 대화</text>
    <text x="670" y="142">놀이 = 상태머신</text>
    <text x="870" y="124">위험 턴 붙잡기 · 도중 검사</text>
    <text x="870" y="142">놀이 이탈 바로잡기</text>
    <text x="870" y="160">→ 스피커 · 부모 기록</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <path d="M200,122 L212,122"/>
    <path d="M385,122 L397,122"/>
  </g>

  <!-- ── 원격 ─────────────────────────────────────────── -->
  <rect x="386" y="236" width="598" height="134" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="398" y="363" font-size="13" font-weight="700" fill="#7e22ce">원격 (OpenAI Realtime · gpt-realtime-mini)</text>

  <g fill="#faf5ff" stroke="#a855f7" stroke-width="1.4">
    <rect x="400" y="266" width="170" height="80" rx="7"/>
    <rect x="585" y="266" width="170" height="80" rx="7"/>
    <rect x="770" y="266" width="200" height="80" rx="7"/>
  </g>
  <g font-size="14.5" fill="#0f172a" text-anchor="middle" font-weight="700">
    <text x="485" y="292">② 말 끝 판정</text>
    <text x="670" y="292">③ 받아 적기</text>
    <text x="870" y="292">⑥ 답 생성 · 음성</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="485" y="314">서버 음성 활동 검출</text>
    <text x="485" y="332">무음 900 ms</text>
    <text x="670" y="314">gpt-4o-transcribe</text>
    <text x="670" y="332">+ 이름·명령 힌트</text>
    <text x="870" y="314">소리를 직접 듣고 답한다</text>
    <text x="870" y="332">음성 marin × 1.05</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <path d="M570,306 L582,306"/>
  </g>

  <!-- 층 사이 -->
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#ar)" fill="none">
    <path d="M485,168 L485,263"/>
    <path d="M650,266 L650,171"/>
    <path d="M700,168 L700,212 L840,212 L840,263"/>
    <path d="M900,266 L900,171"/>
  </g>
  <g font-size="11.5" fill="#334155">
    <text x="492" y="222">소리</text>
    <text x="596" y="222">글자</text>
    <text x="712" y="206">응답 요청 (+ 놀이 지시)</text>
    <text x="908" y="222">글자 + 소리</text>
  </g>

  <!-- 보조 -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2">
    <rect x="30" y="236" width="340" height="134" rx="7"/>
  </g>
  <g font-size="12.5" fill="#0f172a">
    <text x="44" y="258" font-weight="700">보드 안에 남은 것</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="44" y="280">· 호출어 검출 — 대기 중 소리는 밖으로 나가지 않는다</text>
    <text x="44" y="300">· 턴 판단·놀이 진행 — 모델에게 맡기지 않는다</text>
    <text x="44" y="320">· 고정 문구 wav 캐시 — 맞장구·안전·바로잡기 문장</text>
    <text x="44" y="340">· 음악 재생 — 로컬 파일 · 유튜브 아동용</text>
  </g>

  <!-- ── 체감 지연 타임라인 ───────────────────────────── -->
  <line x1="24" y1="390" x2="976" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="418" font-size="15" font-weight="700" fill="#0f172a">체감 응답 지연의 내역 — 구간별 중앙값</text>
  <text x="24" y="439" font-size="12.5" fill="#475569">체감 중앙 2.56 s · 90분위 3.33 s · 3.0 s 이내 14/18턴 (로컬 구성: 4.14 s · 0/5턴)</text>

  <g>
    <rect x="120" y="456" width="420" height="36" fill="#faf5ff" stroke="#a855f7" stroke-width="1.1"/>
    <rect x="540" y="456" width="144" height="36" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.1"/>
    <rect x="684" y="456" width="183" height="36" fill="#fde68a" stroke="#f59e0b" stroke-width="1.1"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">
    <text x="330" y="479">② 무음 대기 1.40 s</text>
    <text x="612" y="479">③ 0.48 s</text>
    <text x="775.5" y="479">④⑥ 0.61 s</text>
  </g>
  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="330" y="508">당시 설정 1,200 ms + 서버 처리</text>
    <text x="612" y="508">받아 적기</text>
    <text x="775.5" y="508">응답 요청 → 첫 소리</text>
  </g>
  <text x="112" y="479" font-size="12" fill="#475569" text-anchor="end">아이 말 끝</text>
  <text x="877" y="479" font-size="12" fill="#475569">첫 소리</text>

  <text x="24" y="542" font-size="12" fill="#475569">주 1) 구간별 중앙값의 합(2.49 s)은 체감 중앙값(2.56 s)과 일치하지 않는다. 턴마다 긴 구간이 달라서다.</text>
  <text x="24" y="562" font-size="12" fill="#475569">주 2) 무음 대기는 9월 22일 900 ms로 줄였다. 아이 녹음 153개에서 −0.28 s, 말 끊김 2 → 3%. 젯슨에서는 다시 재지 않았다.</text>
  <text x="24" y="582" font-size="12" fill="#475569">주 3) 18턴은 성인(개발자) 목소리의 자유대화 12턴·노래 6턴이다. 놀이 턴은 없다.</text>
  <text x="24" y="602" font-size="12" fill="#475569">주 4) 부호 ①~⑥은 로컬 구성(그림 2, 발명의 내용 설명서 도 1)과 같은 역할에 붙였다.</text>
</svg>
