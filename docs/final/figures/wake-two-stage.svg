<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">【도 1】 호출어 2단계 검증의 시점과 구간</text>
  <text x="24" y="55" font-size="12" fill="#475569">위: 1단계 분류기 점수. 아래: 채택 구성과, 구간이 짧아 무증상 고장에 이르는 구성의 대조.</text>

  <!-- 1단계 점수 -->
  <text x="24" y="96" font-size="12" font-weight="700" fill="#1d4ed8">1단계 점수</text>
  <text x="24" y="112" font-size="11" fill="#1d4ed8">(110)</text>
  <line x1="120" y1="196" x2="920" y2="196" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="120" y1="168" x2="920" y2="168" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="926" y="172" font-size="10.5" fill="#64748b">임계값 0.05</text>
  <path d="M120,194 L200,192 L240,180 L258,168 L290,130 L328,104 L370,126 L410,158 L450,182 L500,192 L920,194"
        fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- 후보 시점과 최고점 -->
  <line x1="258" y1="80" x2="258" y2="470" stroke="#0f172a" stroke-width="1.4"/>
  <text x="262" y="78" font-size="11.5" font-weight="700" fill="#0f172a">t0 후보 판정 (120)</text>
  <text x="262" y="92" font-size="10" fill="#64748b">점수가 임계값을 처음 넘는 순간</text>
  <line x1="328" y1="104" x2="328" y2="196" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="334" y="118" font-size="10.5" fill="#1d4ed8">최고점 (130) — t0 + 0.3~0.5초</text>

  <!-- 채택 구성 -->
  <text x="24" y="238" font-size="12" font-weight="700" fill="#047857">채택</text>
  <path d="M258,232 L341,232" stroke="#047857" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="262" y="226" font-size="10.5" fill="#047857">대기 시간 (140) 0.48초</text>
  <rect x="341" y="240" width="519" height="40" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="600" y="265" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">검증 구간 (150) 3.0초 · 38프레임</text>
  <g stroke="#047857" stroke-width="1.1">
    <path d="M341,240 L341,234"/><path d="M860,240 L860,234"/>
  </g>
  <g fill="#34d399" stroke="#047857" stroke-width="0.8">
    <rect x="352" y="292" width="12" height="14"/><rect x="372" y="292" width="12" height="14"/>
    <rect x="392" y="292" width="12" height="14"/><rect x="412" y="292" width="12" height="14"/>
    <rect x="432" y="292" width="12" height="14"/><rect x="452" y="292" width="12" height="14"/>
    <rect x="472" y="292" width="12" height="14"/><rect x="492" y="292" width="12" height="14"/>
    <rect x="512" y="292" width="12" height="14"/><rect x="532" y="292" width="12" height="14"/>
    <rect x="552" y="292" width="12" height="14"/><rect x="572" y="292" width="12" height="14"/>
    <rect x="592" y="292" width="12" height="14"/><rect x="612" y="292" width="12" height="14"/>
    <rect x="632" y="292" width="12" height="14"/><rect x="652" y="292" width="12" height="14"/>
    <rect x="672" y="292" width="12" height="14"/><rect x="692" y="292" width="12" height="14"/>
  </g>
  <text x="712" y="303" font-size="11" fill="#065f46">임베딩 열 (160) 18개 ≥ 요구 16개</text>
  <path d="M440,310 L440,332" stroke="#047857" stroke-width="1.3" marker-end="url(#a1)"/>
  <rect x="341" y="336" width="250" height="36" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="466" y="359" font-size="11.5" fill="#0f172a" text-anchor="middle">본보기 임베딩 (170) 대조 → 유사도 ≥ 0.85</text>
  <path d="M591,354 L637,354" stroke="#047857" stroke-width="1.3" marker-end="url(#a1)"/>
  <rect x="641" y="336" width="140" height="36" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
  <text x="711" y="359" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">호출 확정 (180)</text>
  <text x="791" y="353" font-size="10.5" fill="#64748b">검증 1회 0.08초</text>
  <text x="791" y="367" font-size="10.5" fill="#64748b">추가 메모리 0</text>

  <!-- 전사 판정 OR -->
  <rect x="341" y="384" width="250" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="466" y="405" font-size="11" fill="#475569" text-anchor="middle">전사 판정 (190) — 문자 유사도</text>
  <path d="M591,400 L620,400 L620,372" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#a1)"/>
  <text x="628" y="404" font-size="10.5" font-weight="700" fill="#475569">OR</text>
  <text x="341" y="431" font-size="10" fill="#64748b">전사가 상용구로 환각되어 실패해도 임베딩 대조가 호출을 구제한다</text>

  <!-- 잘못된 구성 -->
  <line x1="24" y1="455" x2="976" y2="455" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="485" font-size="12" font-weight="700" fill="#b91c1c">대조</text>
  <path d="M258,479 L300,479" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#a2)"/>
  <text x="262" y="473" font-size="10.5" fill="#b91c1c">대기 0.24초</text>
  <rect x="300" y="487" width="346" height="34" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="473" y="509" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">검증 구간 (150') 2.0초 · 25프레임</text>
  <g fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8">
    <rect x="312" y="531" width="12" height="14"/><rect x="332" y="531" width="12" height="14"/>
    <rect x="352" y="531" width="12" height="14"/><rect x="372" y="531" width="12" height="14"/>
    <rect x="392" y="531" width="12" height="14"/><rect x="412" y="531" width="12" height="14"/>
    <rect x="432" y="531" width="12" height="14"/><rect x="452" y="531" width="12" height="14"/>
    <rect x="472" y="531" width="12" height="14"/><rect x="492" y="531" width="12" height="14"/>
  </g>
  <text x="512" y="542" font-size="11" fill="#991b1b">임베딩 10개 &lt; 요구 16개 → 유사도 0.000 고정</text>
  <text x="512" y="558" font-size="10.5" font-weight="700" fill="#b91c1c">오류를 반환하지 않으므로 영구 불합격 상태가 드러나지 않는다</text>

  <text x="24" y="586" font-size="10.5" fill="#475569">
    실측: 대기 0.24초·구간 2.0초 0/35 · 대기 0.24초·구간 3.0초 15/35 · 대기 0.48초·구간 3.0초 25/35 (젯슨, 호출 35건, 임계값 0.85)
  </text>
</svg>
